  - aid: red-hat-ansible-automation-platform:ansible-lightspeed-api
    name: Red Hat Ansible Lightspeed with IBM watsonx Code Assistant API
    description: >-
      REST API for Ansible Lightspeed, the generative AI service that produces and explains
      Ansible content. Provides playbook and role generation, content explanations, chat and
      streaming chat, content-match attribution against training data, feedback capture and
      watsonx Code Assistant model/key configuration.
    humanURL: https://c.ai.ansible.redhat.com/
