  - aid: red-hat-ansible-automation-platform:hosted-automation-hub-api
    name: Red Hat Automation Hub API (Hybrid Cloud Console)
    description: >-
      The Red Hat-hosted Automation Hub on console.redhat.com, where subscribers consume Red Hat
      certified and validated Ansible Content Collections. Same galaxy_ng/Pulp contract as a
      private hub, served from Red Hat's own infrastructure; its OpenAPI document is readable
      anonymously while the API itself requires an entitled Red Hat account.
    humanURL: https://console.redhat.com/ansible/automation-hub
