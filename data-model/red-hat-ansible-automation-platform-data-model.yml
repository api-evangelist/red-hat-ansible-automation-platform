description: Entity-relationship model for Red Hat Ansible Automation Platform, derived from the components.schemas
  of the harvested OpenAPI documents. Relationships are read from integer foreign-key fields on each schema
  (AAP uses integer primary keys and names the FK after the target resource), plus the `related` link
  map every Controller object carries.
identifiers:
  style: integer primary keys
  exposure: Every object exposes id (integer), url (its own API path), related (map of associated collection
    URLs) and summary_fields (denormalised parents).
  no_prefixes: AAP does not use typed/prefixed identifiers (no job_ / inv_ style prefixes), so an id is
    only meaningful together with its resource path.
