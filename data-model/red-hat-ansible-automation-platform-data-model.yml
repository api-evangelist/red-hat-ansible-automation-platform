traversal:
  related_map: Follow Controller `related` to reach child collections without constructing URLs (e.g.
    a JobTemplate related.jobs, related.survey_spec, related.launch).
  summary_fields: Read `summary_fields` to avoid an extra GET for parent names.
notes:
- The Job and AdHocCommand schemas are not declared as standalone components in the Controller document
  even though jobs_* and ad_hoc_commands_* operations exist — a contract gap, not a product gap.
- Automation Hub is a Pulp application, so its 390 schemas are dominated by Pulp plumbing (repositories,
  remotes, distributions, tasks, publications) rather than Ansible-specific entities.
