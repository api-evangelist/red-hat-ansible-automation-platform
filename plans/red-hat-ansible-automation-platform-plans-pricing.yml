supersedes: >-
  A 2026-05-04 bulk-sweep scaffold that asserted Free / Professional / Enterprise tiers with
  $0.00 pricing and monthly API request quotas. Red Hat publishes no such tiers and no such
  quotas. That scaffold was fabricated and has been replaced.
description: >-
  Red Hat sells Ansible Automation Platform as a subscription priced per managed node, quoted
  by sales or an authorized partner. The pricing page publishes the SUPPORT tiers and the
  deployment topologies but no numbers: "Pricing varies based on your sizing and subscription
  choices. Talk to a Red Hatter or one of our authorized partners for a customized quote."
  There is no self-serve, no published list price, and no free tier — only a time-limited
  trial.
pricing_model: subscription, quote-based, metered on managed nodes
