note_on_self_hosted_hosts: >-
  The Automation Controller, Gateway and EDA APIs run on the customer's own installation, so
  their /.well-known/ surface cannot be probed from outside. Red Hat's own AAP MCP server
  implements RFC 9728 OAuth protected-resource metadata
  (src/oauth2/protected-resource-metadata.ts in github.com/ansible/aap-mcp-server), which means
  a running AAP MCP deployment does serve /.well-known/oauth-protected-resource — on the
  customer's host, not on a Red Hat one.
