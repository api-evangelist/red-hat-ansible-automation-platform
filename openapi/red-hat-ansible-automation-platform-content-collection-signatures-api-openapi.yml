openapi: 3.2.0
info:
  title: 'Automation Hub Content: Collection_Signatures API'
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: 'Content: Collection_Signatures'
paths:
  /api/automation-hub/pulp/api/v3/content/ansible/collection_signatures/:
    get:
      operationId: content_ansible_collection_signatures_list
      description: ViewSet for looking at signature objects for CollectionVersion content.
      summary: List collection version signatures
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -data
            - -digest
            - -pk
            - -pubkey_fingerprint
            - -pulp_created
            - -pulp_id
            - -pulp_last_updated
            - -pulp_type
            - -timestamp_of_interest
            - -upstream_id
            - data
            - digest
            - pk
            - pubkey_fingerprint
            - pulp_created
            - pulp_id
            - pulp_last_updated
            - pulp_type
            - timestamp_of_interest
            - upstream_id
        description: 'Ordering


          * `pulp_id` - Pulp id

          * `-pulp_id` - Pulp id (descending)

          * `pulp_created` - Pulp created

          * `-pulp_created` - Pulp created (descending)

          * `pulp_last_updated` - Pulp last updated

          * `-pulp_last_updated` - Pulp last updated (descending)

          * `pulp_type` - Pulp type

          * `-pulp_type` - Pulp type (descending)

          * `upstream_id` - Upstream id

          * `-upstream_id` - Upstream id (descending)

          * `timestamp_of_interest` - Timestamp of interest

          * `-timestamp_of_interest` - Timestamp of interest (descending)

          * `data` - Data

          * `-data` - Data (descending)

          * `digest` - Digest

          * `-digest` - Digest (descending)

          * `pubkey_fingerprint` - Pubkey fingerprint

          * `-pubkey_fingerprint` - Pubkey fingerprint (descending)

          * `pk` - Pk

          * `-pk` - Pk (descending)'
        explode: false
        style: form
      - in: query
        name: orphaned_for
        schema:
          type: number
        description: Minutes Content has been orphaned for. -1 uses ORPHAN_PROTECTION_TIME.
      - in: query
        name: pubkey_fingerprint
        schema:
          type: string
        description: Filter results where pubkey_fingerprint matches value
      - in: query
        name: pubkey_fingerprint__in
        schema:
          type: array
          items:
            type: string
        description: Filter results where pubkey_fingerprint is in a comma-separated list of values
        explode: false
        style: form
      - in: query
        name: pulp_href__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: pulp_id__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: repository_version
        schema:
          type: string
        description: Repository Version referenced by HREF
      - in: query
        name: repository_version_added
        schema:
          type: string
        description: Repository Version referenced by HREF
      - in: query
        name: repository_version_removed
        schema:
          type: string
        description: Repository Version referenced by HREF
      - in: query
        name: signed_collection
        schema:
          type: string
          format: uuid
        description: Filter signatures for collection version
      - in: query
        name: signing_service
        schema:
          type: string
          format: uuid
        description: Filter signatures produced by signature service
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Content: Collection_Signatures'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginatedansible.CollectionVersionSignatureResponseList'
          description: ''
    post:
      operationId: content_ansible_collection_signatures_create
      description: Trigger an asynchronous task to create content,optionally create new repository version.
      summary: Create a collection version signature
      tags:
      - 'Content: Collection_Signatures'
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ansible.CollectionVersionSignature'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ansible.CollectionVersionSignature'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/content/ansible/collection_signatures/{pulp_id}/:
    get:
      operationId: content_ansible_collection_signatures_read
      description: ViewSet for looking at signature objects for CollectionVersion content.
      summary: Inspect a collection version signature
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this collection version signature.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Content: Collection_Signatures'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ansible.CollectionVersionSignatureResponse'
          description: ''
components:
  schemas:
    ansible.CollectionVersionSignature:
      type: object
      description: A serializer for signature models.
      properties:
        repository:
          type: string
          format: uri
          writeOnly: true
          description: A URI of a repository the new content unit should be associated with.
        file:
          type: string
          format: binary
          writeOnly: true
          description: An uploaded file that may be turned into the content unit.
        upload:
          type: string
          format: uri
          writeOnly: true
          description: An uncommitted upload that may be turned into the content unit.
        signed_collection:
          type: string
          format: uri
          description: The content this signature is pointing to.
      required:
      - signed_collection
    AsyncOperationResponse:
      type: object
      description: Serializer for asynchronous operations.
      properties:
        task:
          type: string
          format: uri
          description: The href of the task.
      required:
      - task
    ansible.CollectionVersionSignatureResponse:
      type: object
      description: A serializer for signature models.
      properties:
        pulp_href:
          type: string
          format: uri
          readOnly: true
        pulp_created:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of creation.
        pulp_last_updated:
          type: string
          format: date-time
          readOnly: true
          description: 'Timestamp of the last time this resource was updated. Note: for immutable resources - like content, repository versions, and publication - pulp_created and pulp_last_updated dates will be the same.'
        signed_collection:
          type: string
          format: uri
          description: The content this signature is pointing to.
        pubkey_fingerprint:
          type: string
          readOnly: true
          description: The fingerprint of the public key.
        signing_service:
          type:
          - string
          - 'null'
          format: uri
          readOnly: true
          description: The signing service used to create the signature.
      required:
      - signed_collection
    Paginatedansible.CollectionVersionSignatureResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/ansible.CollectionVersionSignatureResponse'
