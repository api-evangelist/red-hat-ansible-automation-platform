          description: ''
      x-ai-description: Cancel an ad hoc command
      summary: Ad hoc commands cancel retrieve
      x-summary-source: derived
    post:
      operationId: ad_hoc_commands_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - ad_hoc_commands
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdHocCommandCancel'
          description: ''
      x-ai-description: Cancel an ad hoc command
      summary: Ad hoc commands cancel create
      x-summary-source: derived
