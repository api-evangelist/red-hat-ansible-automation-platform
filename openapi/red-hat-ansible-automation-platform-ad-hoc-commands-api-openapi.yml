          default: run
        inventory:
          type:
          - integer
          - 'null'
        limit:
          type:
          - string
          - 'null'
          default: ''
        credential:
          type:
          - integer
          - 'null'
        module_name:
          enum:
          - command
          - shell
          - yum
          - apt
          - apt_key
          - apt_repository
          - apt_rpm
          - service
          - group
          - user
          - mount
          - ping
          - selinux
          - setup
          - win_ping
          - win_service
          - win_updates
          - win_group
          - win_user
          type: string
          description: '* `command` - command

            * `shell` - shell

            * `yum` - yum

            * `apt` - apt

            * `apt_key` - apt_key

            * `apt_repository` - apt_repository

            * `apt_rpm` - apt_rpm

            * `service` - service

            * `group` - group

            * `user` - user

            * `mount` - mount

            * `ping` - ping

            * `selinux` - selinux

            * `setup` - setup

            * `win_ping` - win_ping

            * `win_service` - win_service

            * `win_updates` - win_updates

            * `win_group` - win_group

            * `win_user` - win_user'
          x-spec-enum-id: 857230cdbb58eda2
          default: command
        module_args:
          type:
          - string
          - 'null'
          default: ''
        forks:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          default: 0
        verbosity:
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          type: integer
          description: '* `0` - 0 (Normal)

            * `1` - 1 (Verbose)

            * `2` - 2 (More Verbose)

            * `3` - 3 (Debug)

            * `4` - 4 (Connection Debug)

            * `5` - 5 (WinRM Debug)'
          x-spec-enum-id: 8cfb81af905b865a
          default: 0
          minimum: 0
          maximum: 9223372036854775807
        extra_vars:
          type:
          - string
          - 'null'
          default: ''
        become_enabled:
          type:
          - boolean
          - 'null'
          default: false
        diff_mode:
          type:
          - boolean
          - 'null'
          default: false
    UnifiedJobStdout:
      type: object
