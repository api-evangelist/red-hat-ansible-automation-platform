openapi: 3.2.0
info:
  title: 'Automation Hub Acs: File API'
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: 'Acs: File'
paths:
  /api/automation-hub/pulp/api/v3/acs/file/file/:
    get:
      operationId: acs_file_file_list
      description: 'Alternate Content Source ViewSet for File


        ACS support is provided as a tech preview in pulp_file.'
      summary: List file alternate content sources
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
        description: Filter results where name matches value
      - in: query
        name: name__contains
        schema:
          type: string
        description: Filter results where name contains value
      - in: query
        name: name__icontains
        schema:
          type: string
        description: Filter results where name contains value
      - in: query
        name: name__iexact
        schema:
          type: string
        description: Filter results where name matches value
      - in: query
        name: name__in
        schema:
          type: array
          items:
            type: string
        description: Filter results where name is in a comma-separated list of values
        explode: false
        style: form
      - in: query
        name: name__iregex
        schema:
          type: string
        description: Filter results where name matches regex value
      - in: query
        name: name__istartswith
        schema:
          type: string
        description: Filter results where name starts with value
      - in: query
        name: name__regex
        schema:
          type: string
        description: Filter results where name matches regex value
      - in: query
        name: name__startswith
        schema:
          type: string
        description: Filter results where name starts with value
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -last_refreshed
            - -name
            - -pk
            - -pulp_created
            - -pulp_id
            - -pulp_last_updated
            - -pulp_type
            - last_refreshed
            - name
            - pk
            - pulp_created
            - pulp_id
            - pulp_last_updated
            - pulp_type
        description: 'Ordering


          * `pulp_id` - Pulp id

          * `-pulp_id` - Pulp id (descending)

          * `pulp_created` - Pulp created

          * `-pulp_created` - Pulp created (descending)

          * `pulp_last_updated` - Pulp last updated

          * `-pulp_last_updated` - Pulp last updated (descending)

          * `pulp_type` - Pulp type

          * `-pulp_type` - Pulp type (descending)

          * `name` - Name

          * `-name` - Name (descending)

          * `last_refreshed` - Last refreshed

          * `-last_refreshed` - Last refreshed (descending)

          * `pk` - Pk

          * `-pk` - Pk (descending)'
        explode: false
        style: form
      - in: query
        name: pulp_href__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: pulp_id__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Acs: File'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginatedfile.FileAlternateContentSourceResponseList'
          description: ''
    post:
      operationId: acs_file_file_create
      description: 'Alternate Content Source ViewSet for File


        ACS support is provided as a tech preview in pulp_file.'
      summary: Create a file alternate content source
      tags:
      - 'Acs: File'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/file.FileAlternateContentSource'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/file.FileAlternateContentSource'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/file.FileAlternateContentSource'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file.FileAlternateContentSourceResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/acs/file/file/{pulp_id}/:
    get:
      operationId: acs_file_file_read
      description: 'Alternate Content Source ViewSet for File


        ACS support is provided as a tech preview in pulp_file.'
      summary: Inspect a file alternate content source
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this file alternate content source.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Acs: File'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/file.FileAlternateContentSourceResponse'
          description: ''
    put:
      operationId: acs_file_file_update
      description: Trigger an asynchronous update task
      summary: Update a file alternate content source
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this file alternate content source.
        required: true
      tags:
      - 'Acs: File'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/file.FileAlternateContentSource'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/file.FileAlternateContentSource'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/file.FileAlternateContentSource'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
          description: ''
    patch:
      operationId: acs_file_file_partial_update
      description: Trigger an asynchronous partial update task
      summary: Update a file alternate content source
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this file alternate content source.
        required: true
      tags:
      - 'Acs: File'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patchedfile.FileAlternateContentSource'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Patchedfile.FileAlternateContentSource'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Patchedfile.FileAlternateContentSource'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
          description: ''
    delete:
      operationId: acs_file_file_delete
      description: Trigger an asynchronous delete ACS task
      summary: Delete a file alternate content source
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this file alternate content source.
        required: true
      tags:
      - 'Acs: File'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/acs/file/file/{pulp_id}/add_role/:
    post:
      operationId: acs_file_file_add_role
      description: Add a role for this object to users/groups.
      summary: Add a role
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this file alternate content source.
        required: true
      tags:
      - 'Acs: File'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NestedRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NestedRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NestedRole'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestedRoleResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/acs/file/file/{pulp_id}/list_roles/:
    get:
      operationId: acs_file_file_list_roles
      description: List roles assigned to this object.
      summary: List roles
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this file alternate content source.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Acs: File'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectRolesResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/acs/file/file/{pulp_id}/my_permissions/:
    get:
      operationId: acs_file_file_my_permissions
      description: List permissions available to the current user on this object.
      summary: List user permissions
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this file alternate content source.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Acs: File'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPermissionsResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/acs/file/file/{pulp_id}/refresh/:
    post:
      operationId: acs_file_file_refresh
      description: Trigger an asynchronous task to create Alternate Content Source content.
      summary: Refresh metadata
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this file alternate content source.
        required: true
      tags:
      - 'Acs: File'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskGroupOperationResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/acs/file/file/{pulp_id}/remove_role/:
    post:
      operationId: acs_file_file_remove_role
      description: Remove a role for this object from users/groups.
      summary: Remove a role
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this file alternate content source.
        required: true
      tags:
      - 'Acs: File'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NestedRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NestedRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NestedRole'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestedRoleResponse'
          description: ''
components:
  schemas:
    ObjectRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/NestedRoleResponse'
      required:
      - roles
    TaskGroupOperationResponse:
      type: object
      description: Serializer for asynchronous operations that return a task group.
      properties:
        task_group:
          type: string
          format: uri
          description: The href of the task group.
      required:
      - task_group
    AsyncOperationResponse:
      type: object
      description: Serializer for asynchronous operations.
      properties:
        task:
          type: string
          format: uri
          description: The href of the task.
      required:
      - task
    Paginatedfile.FileAlternateContentSourceResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/file.FileAlternateContentSourceResponse'
    NestedRoleResponse:
      type: object
      description: 'Serializer to add/remove object roles to/from users/groups.


        This is used in conjunction with ``pulpcore.app.viewsets.base.RolesMixin`` and requires the

        underlying object to be passed as ``content_object`` in the context.'
      properties:
        users:
          type: array
          items:
            type: string
            description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
          default: []
        groups:
          type: array
          items:
            type: string
          default: []
        role:
          type: string
      required:
      - role
    file.FileAlternateContentSourceResponse:
      type: object
      description: Serializer for File alternate content source.
      properties:
        pulp_href:
          type: string
          format: uri
          readOnly: true
        pulp_created:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of creation.
        pulp_last_updated:
          type: string
          format: date-time
          readOnly: true
          description: 'Timestamp of the last time this resource was updated. Note: for immutable resources - like content, repository versions, and publication - pulp_created and pulp_last_updated dates will be the same.'
        name:
          type: string
          description: Name of Alternate Content Source.
        last_refreshed:
          type:
          - string
          - 'null'
          format: date-time
          description: Date of last refresh of AlternateContentSource.
        paths:
          type: array
          items:
            type: string
          description: List of paths that will be appended to the Remote url when searching for content.
        remote:
          type: string
          format: uri
          description: The remote to provide alternate content source.
      required:
      - name
      - remote
    MyPermissionsResponse:
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
      required:
      - permissions
    Patchedfile.FileAlternateContentSource:
      type: object
      description: Serializer for File alternate content source.
      properties:
        name:
          type: string
          minLength: 1
          description: Name of Alternate Content Source.
        last_refreshed:
          type:
          - string
          - 'null'
          format: date-time
          description: Date of last refresh of AlternateContentSource.
        paths:
          type: array
          items:
            type: string
            minLength: 1
          description: List of paths that will be appended to the Remote url when searching for content.
        remote:
          type: string
          format: uri
          description: The remote to provide alternate content source.
    file.FileAlternateContentSource:
      type: object
      description: Serializer for File alternate content source.
      properties:
        name:
          type: string
          minLength: 1
          description: Name of Alternate Content Source.
        last_refreshed:
          type:
          - string
          - 'null'
          format: date-time
          description: Date of last refresh of AlternateContentSource.
        paths:
          type: array
          items:
            type: string
            minLength: 1
          description: List of paths that will be appended to the Remote url when searching for content.
        remote:
          type: string
          format: uri
          description: The remote to provide alternate content source.
      required:
      - name
      - remote
    NestedRole:
      type: object
      description: 'Serializer to add/remove object roles to/from users/groups.


        This is used in conjunction with ``pulpcore.app.viewsets.base.RolesMixin`` and requires the

        underlying object to be passed as ``content_object`` in the context.'
      properties:
        users:
          type: array
          items:
            type: string
            minLength: 1
            description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
          default: []
        groups:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        role:
          type: string
          minLength: 1
      required:
      - role
