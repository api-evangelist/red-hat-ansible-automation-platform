openapi: 3.2.0
info:
  title: AAP gateway JWT Claims API
  version: v1
  description: AAP gateway API
tags:
- name: jwt_claims
paths:
  /api/gateway/v1/jwt_claims/{user_ansible_id}/:
    get:
      operationId: jwt_claims_retrieve
      description: Get JWT claims for a specific user by their Ansible ID. Accessible by service tokens or superusers.
      parameters:
      - in: path
        name: user_ansible_id
        schema:
          type: string
        required: true
      tags:
      - jwt_claims
      security:
      - OAuth2_Authentication: []
      - SessionAuthentication: []
      - Basic_Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
      x-ai-description: Retrieve single jwt claim
      summary: Jwt claims retrieve
      x-summary-source: derived
components:
  securitySchemes:
    Basic_Authentication:
      type: http
      scheme: basic
    OAuth2_Authentication:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /o/authorize/
          tokenUrl: /o/token/
          scopes:
            read: Read access to resources
            write: Write access to resources (includes read)
        password:
          tokenUrl: /o/token/
          scopes:
            read: Read access to resources
            write: Write access to resources (includes read)
    SessionAuthentication:
      type: apiKey
      in: cookie
      name: gateway_sessionid
