openapi: 3.2.0
info:
  title: AAP Gateway API
  version: v1
  description: AAP gateway API
tags:
- name: AAP Gateway API
paths:
  /api/:
    get:
      operationId: api_retrieve
      tags:
      - AAP Gateway API
      security:
      - OAuth2_Authentication: []
      - SessionAuthentication: []
      - Basic_Authentication: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api_root_view'
          description: ''
      x-ai-description: Retrieve single api
      summary: Api retrieve
      x-summary-source: derived
components:
  schemas:
    api_root_view:
      type: object
      properties:
        description:
          type: string
        apis:
          type: object
          additionalProperties:
            type: string
      required:
      - apis
      - description
  securitySchemes:
    Basic_Authentication:
      type: http
      scheme: basic
    OAuth2_Authentication:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /o/authorize/
          tokenUrl: /o/token/
          scopes:
            read: Read access to resources
            write: Write access to resources (includes read)
        password:
          tokenUrl: /o/token/
          scopes:
            read: Read access to resources
            write: Write access to resources (includes read)
    SessionAuthentication:
      type: apiKey
      in: cookie
      name: gateway_sessionid
