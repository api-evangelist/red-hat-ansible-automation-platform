          description: ''
      x-ai-description: Retrieve single application
      summary: Applications retrieve
      x-summary-source: derived
    put:
      operationId: applications_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuth2Application'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuth2Application'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OAuth2Application'
        required: true
      security:
      - OAuth2_Authentication: []
      - SessionAuthentication: []
      - Basic_Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Application'
          description: ''
      x-ai-description: Update existing application
      summary: Applications update
      x-summary-source: derived
    patch:
      operationId: applications_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - Applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOAuth2Application'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOAuth2Application'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOAuth2Application'
      security:
      - OAuth2_Authentication: []
      - SessionAuthentication: []
      - Basic_Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Application'
          description: ''
      x-ai-description: Partially update existing application
      summary: Applications partial update
      x-summary-source: derived
    delete:
      operationId: applications_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this application.
        required: true
      tags:
      - Applications
      security:
      - OAuth2_Authentication: []
      - SessionAuthentication: []
      - Basic_Authentication: []
      responses:
        '204':
          description: No response body
      x-ai-description: Delete existing application
      summary: Applications destroy
      x-summary-source: derived
