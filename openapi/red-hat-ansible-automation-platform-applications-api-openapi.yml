components:
  schemas:
    OAuth2Token:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        related:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        summary_fields:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        created_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who created this resource.
        modified:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        modified_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who last modified this resource.
        expires:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
          description: The user representing the token owner.
        application:
          type:
          - integer
          - 'null'
          description: The related application. If None, this is a user token instead of an application token.
        description:
          type: string
          description: A description for this token.
        last_used:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
          description: A timestamp of when this token was last used.
        scope:
          type: string
          description: Allowed scopes, further restricts user permissions. Must be a simple space-separated string with allowed scopes ['read', 'write', 'openid', 'roles'].
          maxLength: 128
        token:
          type: string
          readOnly: true
          description: The generated token value.
        refresh_token:
          type:
          - string
          - 'null'
          readOnly: true
    OAuth2Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        related:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        summary_fields:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        created_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who created this resource.
        modified:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        modified_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who last modified this resource.
        name:
          type: string
          description: The name of this resource.
          maxLength: 512
        client_id:
          type: string
          readOnly: true
        redirect_uris:
          type: string
          description: Allowed URIs list, space separated
        post_logout_redirect_uris:
          type: string
          description: Allowed Post Logout URIs list, space separated
        algorithm:
          enum:
          - ''
          - RS256
          - HS256
          type: string
          description: '* `` - No OIDC support

            * `RS256` - RSA with SHA-2 256

            * `HS256` - HMAC with SHA-2 256'
          x-spec-enum-id: efb8c99632a46c3d
        user:
          type:
          - integer
          - 'null'
          description: The user who created the application.
        description:
          type: string
          description: A description of this application.
        organization:
          type: integer
          description: Organization containing this application.
        app_url:
          type:
          - string
          - 'null'
          format: uri
          title: Application URL
          description: The URL of this application.
          maxLength: 200
        client_secret:
          type: string
          readOnly: true
          description: Hashed on Save. Copy it now if this is a new secret.
        client_type:
          enum:
          - confidential
          - public
          type: string
          x-spec-enum-id: 6de8a18fd0ba1b55
          description: 'Set to Public or Confidential depending on how secure the client device is.


            * `confidential` - Confidential

            * `public` - Public'
        skip_authorization:
          type: boolean
          description: Set True to skip authorization step for completely trusted applications.
        authorization_grant_type:
          enum:
          - authorization-code
          - password
          type: string
          x-spec-enum-id: 97829bf36e0a77bf
          description: 'The Grant type the user must use for acquire tokens for this application.


            * `authorization-code` - Authorization code

            * `password` - Resource owner password-based'
      required:
      - authorization_grant_type
      - client_type
      - name
      - organization
    PatchedOAuth2Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        related:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        summary_fields:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        created_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who created this resource.
        modified:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        modified_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who last modified this resource.
        name:
          type: string
          description: The name of this resource.
          maxLength: 512
        client_id:
          type: string
          readOnly: true
        redirect_uris:
          type: string
          description: Allowed URIs list, space separated
        post_logout_redirect_uris:
          type: string
          description: Allowed Post Logout URIs list, space separated
        algorithm:
          enum:
          - ''
          - RS256
          - HS256
          type: string
          description: '* `` - No OIDC support

            * `RS256` - RSA with SHA-2 256

            * `HS256` - HMAC with SHA-2 256'
          x-spec-enum-id: efb8c99632a46c3d
        user:
          type:
          - integer
          - 'null'
          description: The user who created the application.
        description:
          type: string
          description: A description of this application.
        organization:
          type: integer
          description: Organization containing this application.
        app_url:
          type:
          - string
          - 'null'
          format: uri
          title: Application URL
          description: The URL of this application.
          maxLength: 200
        client_secret:
          type: string
          readOnly: true
          description: Hashed on Save. Copy it now if this is a new secret.
        client_type:
          enum:
          - confidential
          - public
          type: string
          x-spec-enum-id: 6de8a18fd0ba1b55
          description: 'Set to Public or Confidential depending on how secure the client device is.


            * `confidential` - Confidential

            * `public` - Public'
        skip_authorization:
          type: boolean
          description: Set True to skip authorization step for completely trusted applications.
        authorization_grant_type:
          enum:
          - authorization-code
          - password
          type: string
          x-spec-enum-id: 97829bf36e0a77bf
          description: 'The Grant type the user must use for acquire tokens for this application.


            * `authorization-code` - Authorization code

            * `password` - Resource owner password-based'
    PaginatedOAuth2TokenList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/OAuth2Token'
    PaginatedOAuth2ApplicationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/OAuth2Application'
  securitySchemes:
    Basic_Authentication:
      type: http
      scheme: basic
    OAuth2_Authentication:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /o/authorize/
          tokenUrl: /o/token/
          scopes:
            read: Read access to resources
            write: Write access to resources (includes read)
        password:
          tokenUrl: /o/token/
          scopes:
            read: Read access to resources
            write: Write access to resources (includes read)
    SessionAuthentication:
      type: apiKey
      in: cookie
      name: gateway_sessionid
