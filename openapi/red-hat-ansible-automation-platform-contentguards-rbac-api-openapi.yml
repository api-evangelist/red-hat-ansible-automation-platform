openapi: 3.2.0
info:
  title: 'Automation Hub Contentguards: Rbac API'
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: 'Contentguards: Rbac'
paths:
  /api/automation-hub/pulp/api/v3/contentguards/core/rbac/:
    get:
      operationId: contentguards_core_rbac_list
      description: 'Viewset for creating contentguards that use RBAC to protect content.

        Has add and remove actions for managing permission for users and groups to download content

        protected by this guard.'
      summary: List rbac content guards
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
        description: Filter results where name matches value
      - in: query
        name: name__contains
        schema:
          type: string
        description: Filter results where name contains value
      - in: query
        name: name__icontains
        schema:
          type: string
        description: Filter results where name contains value
      - in: query
        name: name__iexact
        schema:
          type: string
        description: Filter results where name matches value
      - in: query
        name: name__in
        schema:
          type: array
          items:
            type: string
        description: Filter results where name is in a comma-separated list of values
        explode: false
        style: form
      - in: query
        name: name__iregex
        schema:
          type: string
        description: Filter results where name matches regex value
      - in: query
        name: name__istartswith
        schema:
          type: string
        description: Filter results where name starts with value
      - in: query
        name: name__regex
        schema:
          type: string
        description: Filter results where name matches regex value
      - in: query
        name: name__startswith
        schema:
          type: string
        description: Filter results where name starts with value
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -description
            - -name
            - -pk
            - -pulp_created
            - -pulp_id
            - -pulp_last_updated
            - -pulp_type
            - description
            - name
            - pk
            - pulp_created
            - pulp_id
            - pulp_last_updated
            - pulp_type
        description: 'Ordering


          * `pulp_id` - Pulp id

          * `-pulp_id` - Pulp id (descending)

          * `pulp_created` - Pulp created

          * `-pulp_created` - Pulp created (descending)

          * `pulp_last_updated` - Pulp last updated

          * `-pulp_last_updated` - Pulp last updated (descending)

          * `pulp_type` - Pulp type

          * `-pulp_type` - Pulp type (descending)

          * `name` - Name

          * `-name` - Name (descending)

          * `description` - Description

          * `-description` - Description (descending)

          * `pk` - Pk

          * `-pk` - Pk (descending)'
        explode: false
        style: form
      - in: query
        name: pulp_href__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: pulp_id__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Contentguards: Rbac'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRBACContentGuardResponseList'
          description: ''
    post:
      operationId: contentguards_core_rbac_create
      description: 'Viewset for creating contentguards that use RBAC to protect content.

        Has add and remove actions for managing permission for users and groups to download content

        protected by this guard.'
      summary: Create a rbac content guard
      tags:
      - 'Contentguards: Rbac'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RBACContentGuard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RBACContentGuard'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RBACContentGuard'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBACContentGuardResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/contentguards/core/rbac/{pulp_id}/:
    get:
      operationId: contentguards_core_rbac_read
      description: 'Viewset for creating contentguards that use RBAC to protect content.

        Has add and remove actions for managing permission for users and groups to download content

        protected by this guard.'
      summary: Inspect a rbac content guard
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rbac content guard.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Contentguards: Rbac'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBACContentGuardResponse'
          description: ''
    put:
      operationId: contentguards_core_rbac_update
      description: 'Viewset for creating contentguards that use RBAC to protect content.

        Has add and remove actions for managing permission for users and groups to download content

        protected by this guard.'
      summary: Update a rbac content guard
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rbac content guard.
        required: true
      tags:
      - 'Contentguards: Rbac'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RBACContentGuard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RBACContentGuard'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RBACContentGuard'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBACContentGuardResponse'
          description: ''
    patch:
      operationId: contentguards_core_rbac_partial_update
      description: 'Viewset for creating contentguards that use RBAC to protect content.

        Has add and remove actions for managing permission for users and groups to download content

        protected by this guard.'
      summary: Update a rbac content guard
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rbac content guard.
        required: true
      tags:
      - 'Contentguards: Rbac'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRBACContentGuard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRBACContentGuard'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRBACContentGuard'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RBACContentGuardResponse'
          description: ''
    delete:
      operationId: contentguards_core_rbac_delete
      description: 'Viewset for creating contentguards that use RBAC to protect content.

        Has add and remove actions for managing permission for users and groups to download content

        protected by this guard.'
      summary: Delete a rbac content guard
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rbac content guard.
        required: true
      tags:
      - 'Contentguards: Rbac'
      responses:
        '204':
          description: No response body
  /api/automation-hub/pulp/api/v3/contentguards/core/rbac/{pulp_id}/add_role/:
    post:
      operationId: contentguards_core_rbac_add_role
      description: Add a role for this object to users/groups.
      summary: Add a role
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rbac content guard.
        required: true
      tags:
      - 'Contentguards: Rbac'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NestedRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NestedRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NestedRole'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestedRoleResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/contentguards/core/rbac/{pulp_id}/list_roles/:
    get:
      operationId: contentguards_core_rbac_list_roles
      description: List roles assigned to this object.
      summary: List roles
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rbac content guard.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Contentguards: Rbac'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectRolesResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/contentguards/core/rbac/{pulp_id}/my_permissions/:
    get:
      operationId: contentguards_core_rbac_my_permissions
      description: List permissions available to the current user on this object.
      summary: List user permissions
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rbac content guard.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Contentguards: Rbac'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPermissionsResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/contentguards/core/rbac/{pulp_id}/remove_role/:
    post:
      operationId: contentguards_core_rbac_remove_role
      description: Remove a role for this object from users/groups.
      summary: Remove a role
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this rbac content guard.
        required: true
      tags:
      - 'Contentguards: Rbac'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NestedRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NestedRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NestedRole'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestedRoleResponse'
          description: ''
components:
  schemas:
    ObjectRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/NestedRoleResponse'
      required:
      - roles
    PaginatedRBACContentGuardResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/RBACContentGuardResponse'
    RBACContentGuardResponse:
      type: object
      description: 'Base serializer for use with :class:`pulpcore.app.models.Model`


        This ensures that all Serializers provide values for the ''pulp_href` field.


        The class provides a default for the ``ref_name`` attribute in the

        ModelSerializers''s ``Meta`` class. This ensures that the OpenAPI definitions

        of plugins are namespaced properly.'
      properties:
        pulp_href:
          type: string
          format: uri
          readOnly: true
        pulp_created:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of creation.
        pulp_last_updated:
          type: string
          format: date-time
          readOnly: true
          description: 'Timestamp of the last time this resource was updated. Note: for immutable resources - like content, repository versions, and publication - pulp_created and pulp_last_updated dates will be the same.'
        name:
          type: string
          description: The unique name.
        description:
          type:
          - string
          - 'null'
          description: An optional description.
        users:
          type: array
          items:
            $ref: '#/components/schemas/GroupUserResponse'
          readOnly: true
        groups:
          type: array
          items:
            $ref: '#/components/schemas/GroupResponse'
          readOnly: true
      required:
      - name
    NestedRoleResponse:
      type: object
      description: 'Serializer to add/remove object roles to/from users/groups.


        This is used in conjunction with ``pulpcore.app.viewsets.base.RolesMixin`` and requires the

        underlying object to be passed as ``content_object`` in the context.'
      properties:
        users:
          type: array
          items:
            type: string
            description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
          default: []
        groups:
          type: array
          items:
            type: string
          default: []
        role:
          type: string
      required:
      - role
    GroupUserResponse:
      type: object
      description: Serializer for Users that belong to a Group.
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
          maxLength: 150
        pulp_href:
          type: string
          format: uri
          readOnly: true
      required:
      - username
    MyPermissionsResponse:
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
      required:
      - permissions
    GroupResponse:
      type: object
      description: Serializer for Group.
      properties:
        name:
          type: string
          description: Name
          maxLength: 150
        pulp_href:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          format: int64
          readOnly: true
      required:
      - name
    RBACContentGuard:
      type: object
      description: 'Base serializer for use with :class:`pulpcore.app.models.Model`


        This ensures that all Serializers provide values for the ''pulp_href` field.


        The class provides a default for the ``ref_name`` attribute in the

        ModelSerializers''s ``Meta`` class. This ensures that the OpenAPI definitions

        of plugins are namespaced properly.'
      properties:
        name:
          type: string
          minLength: 1
          description: The unique name.
        description:
          type:
          - string
          - 'null'
          minLength: 1
          description: An optional description.
      required:
      - name
    PatchedRBACContentGuard:
      type: object
      description: 'Base serializer for use with :class:`pulpcore.app.models.Model`


        This ensures that all Serializers provide values for the ''pulp_href` field.


        The class provides a default for the ``ref_name`` attribute in the

        ModelSerializers''s ``Meta`` class. This ensures that the OpenAPI definitions

        of plugins are namespaced properly.'
      properties:
        name:
          type: string
          minLength: 1
          description: The unique name.
        description:
          type:
          - string
          - 'null'
          minLength: 1
          description: An optional description.
    NestedRole:
      type: object
      description: 'Serializer to add/remove object roles to/from users/groups.


        This is used in conjunction with ``pulpcore.app.viewsets.base.RolesMixin`` and requires the

        underlying object to be passed as ``content_object`` in the context.'
      properties:
        users:
          type: array
          items:
            type: string
            minLength: 1
            description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
          default: []
        groups:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        role:
          type: string
          minLength: 1
      required:
      - role
