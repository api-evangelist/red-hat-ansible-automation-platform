openapi: 3.2.0
info:
  title: AWX Workflow Approvals API
  version: v2
  description: AWX API Documentation
  contact:
    email: ansible-community@redhat.com
  license:
    name: Apache License
tags:
- name: workflow_approvals
paths:
  /api/v2/workflow_approvals/:
    get:
      operationId: workflow_approvals_list
      parameters:
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - workflow_approvals
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkflowApprovalListList'
          description: ''
      x-ai-description: List workflow approvals
      summary: Workflow approvals list
      x-summary-source: derived
  /api/v2/workflow_approvals/{id}/:
    get:
      operationId: workflow_approvals_retrieve
      description: Special handling when deleting a running unified job object.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - workflow_approvals
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowApproval'
          description: ''
      x-ai-description: Retrieve a workflow approval
      summary: Workflow approvals retrieve
      x-summary-source: derived
    delete:
      operationId: workflow_approvals_destroy
      description: Special handling when deleting a running unified job object.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - workflow_approvals
      responses:
        '204':
          description: No response body
      x-ai-description: Delete a workflow approval
      summary: Workflow approvals destroy
      x-summary-source: derived
  /api/v2/workflow_approvals/{id}/approve/:
    get:
      operationId: workflow_approvals_approve_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - workflow_approvals
      responses:
        '200':
          description: No response body
      x-ai-description: Retrieve single approve for a workflow_approval
      summary: Workflow approvals approve retrieve
      x-summary-source: derived
    post:
      operationId: workflow_approvals_approve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - workflow_approvals
      responses:
        '200':
          description: No response body
      x-ai-description: Approve a workflow approval
      summary: Workflow approvals approve create
      x-summary-source: derived
  /api/v2/workflow_approvals/{id}/deny/:
    get:
      operationId: workflow_approvals_deny_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - workflow_approvals
      responses:
        '200':
          description: No response body
      x-ai-description: Retrieve single deny for a workflow_approval
      summary: Workflow approvals deny retrieve
      x-summary-source: derived
    post:
      operationId: workflow_approvals_deny_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - workflow_approvals
      responses:
        '200':
          description: No response body
      x-ai-description: Deny a workflow approval
      summary: Workflow approvals deny create
      x-summary-source: derived
