openapi: 3.2.0
info:
  title: 'Automation Hub Api: _Ui V1 My-Synclists Curate API'
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: 'Api: _Ui V1 My-Synclists Curate'
paths:
  /api/automation-hub/_ui/v1/my-synclists/{id}/curate/:
    post:
      operationId: api_automation_hub__ui_v1_my_synclists_curate_curate
      parameters:
      - in: path
        name: id
        schema:
          type: integer
          format: int64
        description: A unique integer value identifying this sync list.
        required: true
      tags:
      - 'Api: _Ui V1 My-Synclists Curate'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncList'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SyncList'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SyncList'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncListResponse'
          description: ''
      summary: Api automation hub ui v1 my synclists curate curate
      x-summary-source: derived
components:
  schemas:
    SyncList:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        policy:
          $ref: '#/components/schemas/Policy8baEnum'
        upstream_repository:
          type:
          - string
          - 'null'
          format: uuid
        distribution:
          type:
          - string
          - 'null'
          format: uuid
        collections:
          type: array
          items:
            $ref: '#/components/schemas/SyncListCollectionSummary'
        namespaces:
          type: array
          items:
            type: string
            minLength: 1
        groups:
          type: string
      required:
      - collections
      - groups
      - name
      - namespaces
    SyncListCollectionSummary:
      type: object
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - name
      - namespace
    SyncListResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 64
        policy:
          $ref: '#/components/schemas/Policy8baEnum'
        upstream_repository:
          type:
          - string
          - 'null'
          format: uuid
        repository:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        distribution:
          type:
          - string
          - 'null'
          format: uuid
        collections:
          type: array
          items:
            $ref: '#/components/schemas/SyncListCollectionSummaryResponse'
        namespaces:
          type: array
          items:
            type: string
        groups:
          type: string
      required:
      - collections
      - groups
      - name
      - namespaces
    Policy8baEnum:
      enum:
      - exclude
      - include
      type: string
      description: '* `exclude` - exclude

        * `include` - include'
    SyncListCollectionSummaryResponse:
      type: object
      properties:
        namespace:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 64
      required:
      - name
      - namespace
