  /api/v2/schedules/{id}/labels/:
    get:
      operationId: schedules_labels_list
      description: 'For related labels lists like /api/v2/inventories/N/labels/


        We want want the last instance to be deleted from the database

        when the last disassociate happens.


        Subclasses need to define parent_model'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
