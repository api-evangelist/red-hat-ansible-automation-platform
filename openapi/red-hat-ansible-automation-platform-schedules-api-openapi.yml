      summary: Schedules instance groups list
      x-summary-source: derived
    post:
      operationId: schedules_instance_groups_create
      description: Derived version of SubListCreateAttachDetachAPIView that prohibits creation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Schedules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceGroupRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceGroup'
          description: ''
