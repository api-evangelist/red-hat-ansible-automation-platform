openapi: 3.2.0
info:
  title: 'Automation Hub Pulp_Ansible: Default Api V3 Plugin Ansible…'
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: 'Pulp_Ansible: Default Api V3 Plugin Ansible Imports Collections'
paths:
  /pulp_ansible/galaxy/default/api/v3/plugin/ansible/imports/collections/{task}/:
    get:
      operationId: pulp_ansible_galaxy_default_api_v3_plugin_ansible_imports_collections_read
      description: Returns a CollectionImport object.
      summary: Inspect a collection import
      parameters:
      - in: query
        name: since
        schema:
          type: string
        description: Filter messages since a given timestamp
      - in: path
        name: task
        schema:
          type: string
          format: uuid
        description: A unique value identifying this collection import.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Pulp_Ansible: Default Api V3 Plugin Ansible Imports Collections'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionImportDetailResponse'
          description: ''
components:
  schemas:
    CollectionImportDetailResponse:
      type: object
      description: A serializer for a CollectionImport detail view.
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          type: object
        messages:
          type: object
      required:
      - created_at
      - id
      - messages
      - started_at
      - state
      - updated_at
