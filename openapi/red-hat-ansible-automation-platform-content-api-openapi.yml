openapi: 3.2.0
info:
  title: Automation Hub Content API
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: Content
paths:
  /api/automation-hub/pulp/api/v3/content/:
    get:
      operationId: content_list
      description: Endpoint to list all content.
      summary: List content
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -pk
            - pk
        description: 'Ordering


          * `pk` - Pk

          * `-pk` - Pk (descending)'
        explode: false
        style: form
      - in: query
        name: orphaned_for
        schema:
          type: number
        description: Minutes Content has been orphaned for. -1 uses ORPHAN_PROTECTION_TIME.
      - in: query
        name: pulp_href__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: pulp_id__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: pulp_type
        schema:
          type: string
          enum:
          - ansible.collection_deprecation
          - ansible.collection_mark
          - ansible.collection_signature
          - ansible.collection_version
          - ansible.namespace
          - ansible.role
          - container.blob
          - container.manifest
          - container.signature
          - container.tag
          - core.publishedmetadata
          - file.file
        description: 'Pulp type


          * `core.publishedmetadata` - core.publishedmetadata

          * `ansible.role` - ansible.role

          * `ansible.collection_version` - ansible.collection_version

          * `ansible.collection_mark` - ansible.collection_mark

          * `ansible.collection_signature` - ansible.collection_signature

          * `ansible.namespace` - ansible.namespace

          * `ansible.collection_deprecation` - ansible.collection_deprecation

          * `container.blob` - container.blob

          * `container.manifest` - container.manifest

          * `container.tag` - container.tag

          * `container.signature` - container.signature

          * `file.file` - file.file'
      - in: query
        name: pulp_type__in
        schema:
          type: array
          items:
            type: string
            enum:
            - ansible.collection_deprecation
            - ansible.collection_mark
            - ansible.collection_signature
            - ansible.collection_version
            - ansible.namespace
            - ansible.role
            - container.blob
            - container.manifest
            - container.signature
            - container.tag
            - core.publishedmetadata
            - file.file
        description: 'Multiple values may be separated by commas.


          * `core.publishedmetadata` - core.publishedmetadata

          * `ansible.role` - ansible.role

          * `ansible.collection_version` - ansible.collection_version

          * `ansible.collection_mark` - ansible.collection_mark

          * `ansible.collection_signature` - ansible.collection_signature

          * `ansible.namespace` - ansible.namespace

          * `ansible.collection_deprecation` - ansible.collection_deprecation

          * `container.blob` - container.blob

          * `container.manifest` - container.manifest

          * `container.tag` - container.tag

          * `container.signature` - container.signature

          * `file.file` - file.file'
        explode: false
        style: form
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: repository_version
        schema:
          type: string
        description: Repository Version referenced by HREF
      - in: query
        name: repository_version_added
        schema:
          type: string
        description: Repository Version referenced by HREF
      - in: query
        name: repository_version_removed
        schema:
          type: string
        description: Repository Version referenced by HREF
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - Content
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMultipleArtifactContentResponseList'
          description: ''
components:
  schemas:
    MultipleArtifactContentResponse:
      type: object
      description: 'Base serializer for use with :class:`pulpcore.app.models.Model`


        This ensures that all Serializers provide values for the ''pulp_href` field.


        The class provides a default for the ``ref_name`` attribute in the

        ModelSerializers''s ``Meta`` class. This ensures that the OpenAPI definitions

        of plugins are namespaced properly.'
      properties:
        pulp_href:
          type: string
          format: uri
          readOnly: true
        pulp_created:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of creation.
        pulp_last_updated:
          type: string
          format: date-time
          readOnly: true
          description: 'Timestamp of the last time this resource was updated. Note: for immutable resources - like content, repository versions, and publication - pulp_created and pulp_last_updated dates will be the same.'
        artifacts:
          type: object
          description: 'A dict mapping relative paths inside the Content to the correspondingArtifact URLs. E.g.: {''relative/path'': ''/artifacts/1/'''
      required:
      - artifacts
    PaginatedMultipleArtifactContentResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/MultipleArtifactContentResponse'
