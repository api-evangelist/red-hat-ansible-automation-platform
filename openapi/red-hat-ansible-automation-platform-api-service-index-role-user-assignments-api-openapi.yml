openapi: 3.2.0
info:
  title: 'Automation Hub Api: Service-Index Role-User-Assignments API'
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: 'Api: Service-Index Role-User-Assignments'
paths:
  /api/automation-hub/service-index/role-user-assignments/:
    get:
      operationId: api_automation_hub_service_index_role_user_assignments_list
      description: List of user assignments for cross-service communication
      summary: List role user assignments
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Api: Service-Index Role-User-Assignments'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceRoleUserAssignmentResponseList'
          description: ''
components:
  schemas:
    ServiceRoleUserAssignmentResponse:
      type: object
      properties:
        created:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        created_by_ansible_id:
          type:
          - string
          - 'null'
          format: uuid
        object_id:
          type:
          - string
          - 'null'
        object_ansible_id:
          type:
          - string
          - 'null'
        content_type:
          type: string
          description: String to use for references to this type from other models in the API.
          readOnly: true
        role_definition:
          type: string
          description: The name of this role.
        user_ansible_id:
          type: string
          format: uuid
      required:
      - role_definition
      - user_ansible_id
    PaginatedServiceRoleUserAssignmentResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ServiceRoleUserAssignmentResponse'
