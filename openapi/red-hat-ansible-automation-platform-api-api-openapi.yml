components:
  schemas:
    api_root_view:
      type: object
      properties:
        description:
          type: string
        apis:
          type: object
          additionalProperties:
            type: string
      required:
      - apis
      - description
    api_gateway_root_view:
      type: object
      properties:
        current_version:
          type: string
        available_versions:
          type: object
          additionalProperties:
            type: string
      required:
      - available_versions
      - current_version
  securitySchemes:
    Basic_Authentication:
      type: http
      scheme: basic
    OAuth2_Authentication:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /o/authorize/
          tokenUrl: /o/token/
          scopes:
            read: Read access to resources
            write: Write access to resources (includes read)
        password:
          tokenUrl: /o/token/
          scopes:
            read: Read access to resources
            write: Write access to resources (includes read)
    SessionAuthentication:
      type: apiKey
      in: cookie
      name: gateway_sessionid
