          description: ''
      x-ai-description: A list of workflow jobs.
      summary: Workflow jobs list
      x-summary-source: derived
  /api/v2/workflow_jobs/{id}/:
    get:
      operationId: workflow_jobs_retrieve
      description: Special handling when deleting a running unified job object.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Workflow Jobs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowJob'
          description: ''
      x-ai-description: Retrieve a workflow job
      summary: Workflow jobs retrieve
      x-summary-source: derived
    delete:
      operationId: workflow_jobs_destroy
      description: Special handling when deleting a running unified job object.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Workflow Jobs
      responses:
        '204':
          description: No response body
      x-ai-description: Delete a workflow job
      summary: Workflow jobs destroy
      x-summary-source: derived
