          description: '* `ssh` - Machine

            * `vault` - Vault

            * `net` - Network

            * `scm` - Source Control

            * `cloud` - Cloud

            * `registry` - Container Registry

            * `token` - Personal Access Token

            * `insights` - Insights

            * `external` - External

            * `kubernetes` - Kubernetes

            * `galaxy` - Galaxy/Automation Hub

            * `cryptography` - Cryptography'
          x-spec-enum-id: 8c34823df94b101f
        namespace:
          type:
          - string
          - 'null'
          readOnly: true
        managed:
          type: boolean
          readOnly: true
        inputs:
