openapi: 3.2.0
info:
  title: Red Hat Ansible Automation Platform Credential Types API
  version: '1.0'
  description: 'Operations tagged credential_types across 2 of this provider''s published API definitions: red-hat-ansible-automation-platform-automation-controller-openapi.json, red-hat-ansible-automation-platform-event-driven-ansible-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/eda/v1
tags:
- name: Credential Types
paths:
  /api/v2/credential_types/:
    get:
      operationId: credential_types_list
      parameters:
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - Credential Types
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCredentialTypeList'
          description: ''
      x-ai-description: Returns a paginated list of all credential types (machine, vault, cloud, etc.).
      summary: Credential types list
      x-summary-source: derived
    post:
      operationId: credential_types_create
      tags:
      - Credential Types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialTypeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialType'
          description: ''
      x-ai-description: Create a new custom credential type
      summary: Credential types create
      x-summary-source: derived
  /api/v2/credential_types/{id}/:
    get:
      operationId: credential_types_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Credential Types
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialType'
          description: ''
      x-ai-description: Retrieve a credential type
      summary: Credential types retrieve
      x-summary-source: derived
    put:
      operationId: credential_types_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Credential Types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialTypeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialType'
          description: ''
      x-ai-description: Update a custom credential type.
      summary: Credential types update
      x-summary-source: derived
    patch:
      operationId: credential_types_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Credential Types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCredentialTypeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialType'
          description: ''
      x-ai-description: Update a custom credential type.
      summary: Credential types partial update
      x-summary-source: derived
    delete:
      operationId: credential_types_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Credential Types
      responses:
        '204':
          description: No response body
      x-ai-description: Delete a custom credential type. Cannot delete managed types or types currently in use.
      summary: Credential types destroy
      x-summary-source: derived
  /api/v2/credential_types/{id}/activity_stream/:
    get:
      operationId: credential_types_activity_stream_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - Credential Types
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivityStreamList'
          description: ''
      x-ai-description: Get activity stream for credential type
      summary: Credential types activity stream list
      x-summary-source: derived
  /api/v2/credential_types/{id}/credentials/:
    get:
      operationId: credential_types_credentials_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - Credential Types
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCredentialList'
          description: ''
      x-ai-description: List credentials of a credential type
      summary: Credential types credentials list
      x-summary-source: derived
    post:
      operationId: credential_types_credentials_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Credential Types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
          description: ''
      x-ai-description: Create a credential of a credential type
      summary: Credential types credentials create
      x-summary-source: derived
  /api/v2/credential_types/{id}/test/:
    get:
      operationId: credential_types_test_retrieve
      description: 'Test a complete set of input values for an external credential before

        saving it.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Credential Types
      responses:
        '200':
          description: No response body
      x-ai-description: Retrieve single test for a credential_type
      summary: Credential types test retrieve
      x-summary-source: derived
    post:
      operationId: credential_types_test_create
      description: 'Test a complete set of input values for an external credential before

        saving it.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Credential Types
      responses:
        '200':
          description: No response body
      x-ai-description: Test a complete set of input values for an external credential
      summary: Credential types test create
      x-summary-source: derived
  /credential-types/:
    get:
      operationId: credential_types_list
      description: List all credential types
      parameters:
      - in: query
        name: name
        schema:
          type: string
        description: Filter by credential type name.
      - in: query
        name: namespace
        schema:
          type: string
        description: Filter by credential type namespace.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Credential Types
      security:
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCredentialTypeList_2'
          description: Return a list of credential types.
      summary: Credential types list
      x-summary-source: derived
    post:
      operationId: credential_types_create
      description: Create a new credential type.
      tags:
      - Credential Types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialTypeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialTypeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialTypeCreate'
        required: true
      security:
      - EDAJWTAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialType_2'
          description: Return the new credential type.
      summary: Credential types create
      x-summary-source: derived
    servers:
    - url: /api/eda/v1
  /credential-types/{id}/:
    get:
      operationId: credential_types_retrieve
      description: Get credential type by id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credential type.
        required: true
      tags:
      - Credential Types
      security:
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialType_2'
          description: Return a credential type by id.
      summary: Credential types retrieve
      x-summary-source: derived
    patch:
      operationId: credential_types_partial_update
      description: Partial update of a credential type
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credential type.
        required: true
      tags:
      - Credential Types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCredentialTypeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCredentialTypeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCredentialTypeCreate'
      security:
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialType_2'
          description: Update successful. Return an updated credential type.
      summary: Credential types partial update
      x-summary-source: derived
    delete:
      operationId: credential_types_destroy
      description: Delete a credential type by id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credential type.
        required: true
      tags:
      - Credential Types
      security:
      - EDAJWTAuthentication: []
      responses:
        '204':
          description: Delete successful.
        '409':
          description: CredentialType in use by Credentials.
      summary: Credential types destroy
      x-summary-source: derived
    servers:
    - url: /api/eda/v1
  /credential-types/{id}/test/:
    post:
      operationId: credential_types_test_create
      description: Run a test on External Credential
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credential type.
        required: true
      tags:
      - Credential Types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialTypeTest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialTypeTest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialTypeTest'
        required: true
      security:
      - EDAJWTAuthentication: []
      responses:
        '202':
          description: Test Successful.
        '400':
          description: Test failed.
      summary: Credential types test create
      x-summary-source: derived
    servers:
    - url: /api/eda/v1
components:
  schemas:
    PaginatedCredentialList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Credential'
    CredentialTypeRequest:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 512
        description:
          type:
          - string
          - 'null'
          default: ''
        kind:
          enum:
          - cloud
          - net
          type:
          - string
          - 'null'
          description: '* `cloud` - Cloud\n* `net` - Network'
          x-spec-enum-id: 8c34823df94b101f
        inputs:
          default: {}
          description: Enter inputs using either JSON or YAML syntax. Refer to the documentation for example syntax.
        injectors:
          default: {}
          description: Enter injectors using either JSON or YAML syntax. Refer to the documentation for example syntax.
      required:
      - kind
      - name
    PaginatedActivityStreamList:
      type: object
      required:
