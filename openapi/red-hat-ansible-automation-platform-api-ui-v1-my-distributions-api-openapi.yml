openapi: 3.2.0
info:
  title: 'Automation Hub Api: _Ui V1 My-Distributions API'
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: 'Api: _Ui V1 My-Distributions'
paths:
  /api/automation-hub/_ui/v1/my-distributions/:
    get:
      operationId: api_automation_hub__ui_v1_my_distributions_list
      summary: List ansible distributions
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Api: _Ui V1 My-Distributions'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDistributionResponseList'
          description: ''
  /api/automation-hub/_ui/v1/my-distributions/{pulp_id}/:
    get:
      operationId: api_automation_hub__ui_v1_my_distributions_read
      summary: Inspect an ansible distribution
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this ansible distribution.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Api: _Ui V1 My-Distributions'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionResponse'
          description: ''
components:
  schemas:
    DistributionResponse:
      type: object
      properties:
        pulp_id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        base_path:
          type: string
        repository:
          $ref: '#/components/schemas/RepositoryResponse'
      required:
      - base_path
      - name
      - repository
    PaginatedDistributionResponseList:
      type: object
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
              example: 123
        links:
          type: object
          properties:
            first:
              type:
              - string
              - 'null'
            previous:
              type:
              - string
              - 'null'
            next:
              type:
              - string
              - 'null'
            last:
              type:
              - string
              - 'null'
        data:
          type: array
          items:
            $ref: '#/components/schemas/DistributionResponse'
    RepositoryResponse:
      type: object
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        pulp_id:
          type: string
          format: uuid
          readOnly: true
        pulp_last_updated:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        content_count:
          type: integer
          readOnly: true
        gpgkey:
          type: string
      required:
      - gpgkey
      - name
