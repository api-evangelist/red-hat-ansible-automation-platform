      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
          description: ''
      x-ai-description: Update a credential
      summary: Credentials partial update
      x-summary-source: derived
    delete:
      operationId: credentials_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Credentials
      responses:
        '204':
          description: No response body
      x-ai-description: Delete a credential
      summary: Credentials destroy
      x-summary-source: derived
