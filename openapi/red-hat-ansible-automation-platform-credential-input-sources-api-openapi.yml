      summary: Credential input sources update
      x-summary-source: derived
    patch:
      operationId: credential_input_sources_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - credential_input_sources
      requestBody:
        content:
          application/json:
