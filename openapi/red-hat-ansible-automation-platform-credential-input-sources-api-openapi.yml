      summary: Credential input sources list
      x-summary-source: derived
    post:
      operationId: credential_input_sources_create
      tags:
      - credential_input_sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInputSourceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialInputSource'
          description: ''
      x-ai-description: Create a credential input source
      summary: Credential input sources create
      x-summary-source: derived
  /api/v2/credential_input_sources/{id}/:
    get:
      operationId: credential_input_sources_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - credential_input_sources
      responses:
