          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - credential_input_sources
      responses:
        '204':
          description: No response body
      x-ai-description: Delete a credential input source
      summary: Credential input sources destroy
      x-summary-source: derived
  /credential-input-sources/:
    get:
      operationId: credential_input_sources_list
      description: List all Credential Input Sources
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: source_credential
        schema:
          type: integer
        description: Filter by Source Credential ID.
      - in: query
        name: target_credential
        schema:
          type: integer
        description: Filter by Target Credential ID.
      tags:
      - credential_input_sources
      security:
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCredentialInputSourceList_2'
          description: Return a list of Credential Input Sources.
      summary: Credential input sources list
      x-summary-source: derived
    post:
      operationId: credential_input_sources_create
      description: Create a new Credential Input Source.
      tags:
      - credential_input_sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInputSourceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CredentialInputSourceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CredentialInputSourceCreate'
        required: true
      security:
      - EDAJWTAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialInputSource_2'
          description: Return the new Credential Input Source.
      summary: Credential input sources create
      x-summary-source: derived
    servers:
    - url: /api/eda/v1
  /credential-input-sources/{id}/:
    get:
      operationId: credential_input_sources_retrieve
      description: Get CredentialInputSource by id
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credential input source.
        required: true
      - in: query
        name: refs
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Query resources that have reference to the credential input source by its id
      tags:
      - credential_input_sources
      security:
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialInputSource_2'
          description: Return an Credential Input Source by id.
      summary: Credential input sources retrieve
      x-summary-source: derived
    patch:
      operationId: credential_input_sources_partial_update
      description: Partial update of an Credential Input Source
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credential input source.
        required: true
      tags:
      - credential_input_sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCredentialInputSourceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCredentialInputSourceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCredentialInputSourceUpdate'
      security:
      - EDAJWTAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialInputSource_2'
          description: Update successful. Return an updated credential input source.
      summary: Credential input sources partial update
      x-summary-source: derived
    delete:
      operationId: credential_input_sources_destroy
      description: 'The CredentialInputSourceViewSet is used to link fields to external SMS.


        When the linkage happens we need the Source, Target credential and the

        field name'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this credential input source.
        required: true
      tags:
      - credential_input_sources
      security:
      - EDAJWTAuthentication: []
      responses:
        '204':
          description: No response body
      summary: Credential input sources destroy
      x-summary-source: derived
    servers:
    - url: /api/eda/v1
