info:
  title: Red Hat Ansible Automation Platform Credential Input…
  version: '1.0'
  description: 'Operations tagged credential_input_sources across 2 of this provider''s published API definitions: red-hat-ansible-automation-platform-automation-controller-openapi.json, red-hat-ansible-automation-platform-event-driven-ansible-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /api/eda/v1
tags:
- name: credential_input_sources
