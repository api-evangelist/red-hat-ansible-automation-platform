servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: 'Api: _Ui V2 Role_Definitions User_Assignments'
paths:
  /api/automation-hub/_ui/v2/role_definitions/{id}/user_assignments/:
    get:
      operationId: api_automation_hub__ui_v2_role_definitions_user_assignments_list
      description: 'Manage Role User Assignment objects in the ''user_assignments'' relationship of this particular Role Definition.


        Starting from the detail URL:


        GET /:id/user_assignments/ to show role user assignments currently in the relationship'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Api: _Ui V2 Role_Definitions User_Assignments'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRoleUserAssignmentResponseList'
          description: ''
      summary: Api automation hub ui v2 role definitions user assignments list
      x-summary-source: derived
components:
  schemas:
    RoleUserAssignmentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        url:
          type: string
          readOnly: true
        related:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        summary_fields:
          type: object
          additionalProperties:
            type: object
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        created_by:
          type:
          - integer
          - 'null'
          format: int64
          readOnly: true
          description: The user who created this resource.
        content_type:
          type: string
          description: String to use for references to this type from other models in the API.
          readOnly: true
        object_id:
          type:
          - string
          - 'null'
          description: The primary key of the object this assignment applies to; null value indicates system-wide assignment.
        object_ansible_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The resource id of the object this role applies to. An alternative to the object_id field.
        role_definition:
          type: integer
          format: int64
          description: The role definition which defines permissions conveyed by this assignment.
        user:
          type: integer
          format: int64
        user_ansible_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The resource ID of the user who will receive permissions from this assignment. An alternative to user field.
      required:
      - role_definition
    PaginatedRoleUserAssignmentResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/RoleUserAssignmentResponse'
