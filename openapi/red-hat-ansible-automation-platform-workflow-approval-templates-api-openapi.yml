openapi: 3.2.0
info:
  title: AWX Workflow Approval Templates API
  version: v2
  description: AWX API Documentation
  contact:
    email: ansible-community@redhat.com
  license:
    name: Apache License
tags:
- name: workflow_approval_templates
paths:
  /api/v2/workflow_approval_templates/{id}/:
    get:
      operationId: workflow_approval_templates_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - workflow_approval_templates
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowApprovalTemplate'
          description: ''
      x-ai-description: Retrieve a workflow approval template detail
      summary: Workflow approval templates retrieve
      x-summary-source: derived
    put:
      operationId: workflow_approval_templates_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - workflow_approval_templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowApprovalTemplateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowApprovalTemplate'
          description: ''
      x-ai-description: Update a workflow approval template detail
      summary: Workflow approval templates update
      x-summary-source: derived
    patch:
      operationId: workflow_approval_templates_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - workflow_approval_templates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkflowApprovalTemplateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowApprovalTemplate'
          description: ''
      x-ai-description: Update a workflow approval template detail
      summary: Workflow approval templates partial update
      x-summary-source: derived
    delete:
      operationId: workflow_approval_templates_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - workflow_approval_templates
      responses:
        '204':
          description: No response body
      x-ai-description: Delete a workflow approval template detail
      summary: Workflow approval templates destroy
      x-summary-source: derived
  /api/v2/workflow_approval_templates/{id}/approvals/:
    get:
      operationId: workflow_approval_templates_approvals_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - workflow_approval_templates
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkflowApprovalListList'
          description: ''
      x-ai-description: List all approvals for a workflow_approval_template
      summary: Workflow approval templates approvals list
      x-summary-source: derived
