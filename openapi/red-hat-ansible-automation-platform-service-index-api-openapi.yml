        team_ansible_id:
          type: string
          format: uuid
      required:
      - role_definition
      - team_ansible_id
    ResourceRequest:
      type: object
      properties:
        ansible_id:
          type: string
          format: uuid
          description: A unique ID identifying this resource by the resource server.
        service_id:
          type: string
          format: uuid
