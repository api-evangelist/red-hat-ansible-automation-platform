openapi: 3.2.0
info:
  title: AAP gateway Authenticator Plugins API
  version: v1
  description: AAP gateway API
tags:
- name: authenticator_plugins
paths:
  /api/gateway/v1/authenticator_plugins/:
    get:
      operationId: authenticator_plugins_retrieve
      tags:
      - authenticator_plugins
      security:
      - OAuth2_Authentication: []
      - SessionAuthentication: []
      - Basic_Authentication: []
      responses:
        '200':
          description: No response body
      x-ai-description: Retrieve single authenticator plugin
      summary: Authenticator plugins retrieve
      x-summary-source: derived
components:
  securitySchemes:
    Basic_Authentication:
      type: http
      scheme: basic
    OAuth2_Authentication:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /o/authorize/
          tokenUrl: /o/token/
          scopes:
            read: Read access to resources
            write: Write access to resources (includes read)
        password:
          tokenUrl: /o/token/
          scopes:
            read: Read access to resources
            write: Write access to resources (includes read)
    SessionAuthentication:
      type: apiKey
      in: cookie
      name: gateway_sessionid
