openapi: 3.2.0
info:
  title: AWX Instances API
  version: v2
  description: AWX API Documentation
  contact:
    email: ansible-community@redhat.com
  license:
    name: Apache License
tags:
- name: Instances
paths:
  /api/v2/instances/:
    get:
      operationId: instances_list
      description: Creates an instance if used on a Kubernetes or OpenShift deployment of Ansible Automation Platform.
      parameters:
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - Instances
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstanceList'
          description: ''
      x-ai-description: List instances
      summary: Instances list
      x-summary-source: derived
    post:
      operationId: instances_create
      description: Creates an instance if used on a Kubernetes or OpenShift deployment of Ansible Automation Platform.
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
          description: ''
      x-ai-description: Register an execution or hop node instance. Only available on openshift based AAP deployments. Use the install bundle playbook to further provision the instance
      summary: Instances create
      x-summary-source: derived
  /api/v2/instances/{id}/:
    get:
      operationId: instances_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Instances
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
          description: ''
      x-ai-description: Retrieve an instance
      summary: Instances retrieve
      x-summary-source: derived
    put:
      operationId: instances_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
          description: ''
      x-ai-description: Update an instance
      summary: Instances update
      x-summary-source: derived
    patch:
      operationId: instances_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInstanceRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
          description: ''
      x-ai-description: Update an instance
      summary: Instances partial update
      x-summary-source: derived
  /api/v2/instances/{id}/health_check/:
    get:
      operationId: instances_health_check_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Instances
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceHealthCheck'
          description: ''
      x-ai-description: Get instance health check result
      summary: Instances health check retrieve
      x-summary-source: derived
    post:
      operationId: instances_health_check_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Instances
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceHealthCheck'
          description: ''
      x-ai-description: Perform instance health check
      summary: Instances health check create
      x-summary-source: derived
  /api/v2/instances/{id}/install_bundle/:
    get:
      operationId: instances_install_bundle_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Instances
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
          description: ''
      x-ai-description: Generate and download install bundle for an instance
      summary: Instances install bundle retrieve
      x-summary-source: derived
  /api/v2/instances/{id}/instance_groups/:
    get:
      operationId: instances_instance_groups_list
      description: 'This mixin overloads attach/detach so that it calls InstanceGroup.save(),

        triggering a background recalculation of policy-based instance group

        membership.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - Instances
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstanceGroupList'
          description: ''
      x-ai-description: List instance groups of an instance
      summary: Instances instance groups list
      x-summary-source: derived
    post:
      operationId: instances_instance_groups_create
      description: 'This mixin overloads attach/detach so that it calls InstanceGroup.save(),

        triggering a background recalculation of policy-based instance group

        membership.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceGroupRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceGroup'
          description: ''
      x-ai-description: Create an instance group of an instance
      summary: Instances instance groups create
      x-summary-source: derived
  /api/v2/instances/{id}/jobs/:
    get:
      operationId: instances_jobs_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - Instances
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUnifiedJobListList'
          description: ''
      x-ai-description: List jobs executed on an instance
      summary: Instances jobs list
      x-summary-source: derived
  /api/v2/instances/{id}/peers/:
    get:
      operationId: instances_peers_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
