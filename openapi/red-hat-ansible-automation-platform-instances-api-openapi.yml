      summary: Instances peers list
      x-summary-source: derived
  /api/v2/instances/{id}/receptor_addresses/:
    get:
      operationId: instances_receptor_addresses_list
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: query
        name: order
        schema:
