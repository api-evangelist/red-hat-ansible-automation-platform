          description: ''
      x-ai-description: List all routes
      summary: Routes list
      x-summary-source: derived
    post:
      operationId: routes_create
      description: API endpoint that allows additional routes to be viewed or edited.
      tags:
      - Routes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdditionalRoute'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdditionalRoute'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdditionalRoute'
        required: true
      security:
      - OAuth2_Authentication: []
      - SessionAuthentication: []
      - Basic_Authentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalRoute'
          description: ''
      x-ai-description: Create new route
      summary: Routes create
      x-summary-source: derived
  /api/gateway/v1/routes/{id}/:
    get:
      operationId: routes_retrieve
      description: API endpoint that allows additional routes to be viewed or edited.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this additional route.
        required: true
      tags:
      - Routes
      security:
      - OAuth2_Authentication: []
      - SessionAuthentication: []
      - Basic_Authentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalRoute'
          description: ''
      x-ai-description: Retrieve single route
      summary: Routes retrieve
      x-summary-source: derived
    put:
