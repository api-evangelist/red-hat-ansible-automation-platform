openapi: 3.2.0
info:
  title: 'Automation Hub Repositories: Container-Push API'
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: 'Repositories: Container-Push'
paths:
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/:
    get:
      operationId: repositories_container_container_push_list
      description: 'ViewSet for a container push repository.


        POST and DELETE are disallowed because a push repository is tightly coupled with a

        ContainerDistribution which handles it automatically.

        Created - during push operation, removed - with ContainerDistribution removal.'
      summary: List container push repositorys
      parameters:
      - in: query
        name: latest_with_content
        schema:
          type: string
        description: Content Unit referenced by HREF
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
        description: Filter results where name matches value
      - in: query
        name: name__contains
        schema:
          type: string
        description: Filter results where name contains value
      - in: query
        name: name__icontains
        schema:
          type: string
        description: Filter results where name contains value
      - in: query
        name: name__iexact
        schema:
          type: string
        description: Filter results where name matches value
      - in: query
        name: name__in
        schema:
          type: array
          items:
            type: string
        description: Filter results where name is in a comma-separated list of values
        explode: false
        style: form
      - in: query
        name: name__iregex
        schema:
          type: string
        description: Filter results where name matches regex value
      - in: query
        name: name__istartswith
        schema:
          type: string
        description: Filter results where name starts with value
      - in: query
        name: name__regex
        schema:
          type: string
        description: Filter results where name matches regex value
      - in: query
        name: name__startswith
        schema:
          type: string
        description: Filter results where name starts with value
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -description
            - -name
            - -next_version
            - -pk
            - -pulp_created
            - -pulp_id
            - -pulp_labels
            - -pulp_last_updated
            - -pulp_type
            - -retain_repo_versions
            - -user_hidden
            - description
            - name
            - next_version
            - pk
            - pulp_created
            - pulp_id
            - pulp_labels
            - pulp_last_updated
            - pulp_type
            - retain_repo_versions
            - user_hidden
        description: 'Ordering


          * `pulp_id` - Pulp id

          * `-pulp_id` - Pulp id (descending)

          * `pulp_created` - Pulp created

          * `-pulp_created` - Pulp created (descending)

          * `pulp_last_updated` - Pulp last updated

          * `-pulp_last_updated` - Pulp last updated (descending)

          * `pulp_type` - Pulp type

          * `-pulp_type` - Pulp type (descending)

          * `name` - Name

          * `-name` - Name (descending)

          * `pulp_labels` - Pulp labels

          * `-pulp_labels` - Pulp labels (descending)

          * `description` - Description

          * `-description` - Description (descending)

          * `next_version` - Next version

          * `-next_version` - Next version (descending)

          * `retain_repo_versions` - Retain repo versions

          * `-retain_repo_versions` - Retain repo versions (descending)

          * `user_hidden` - User hidden

          * `-user_hidden` - User hidden (descending)

          * `pk` - Pk

          * `-pk` - Pk (descending)'
        explode: false
        style: form
      - in: query
        name: pulp_href__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: pulp_id__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: pulp_label_select
        schema:
          type: string
        description: Filter labels by search string
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: remote
        schema:
          type: string
          format: uuid
        description: Foreign Key referenced by HREF
      - in: query
        name: retain_repo_versions
        schema:
          type: integer
        description: Filter results where retain_repo_versions matches value
      - in: query
        name: retain_repo_versions__gt
        schema:
          type: integer
        description: Filter results where retain_repo_versions is greater than value
      - in: query
        name: retain_repo_versions__gte
        schema:
          type: integer
        description: Filter results where retain_repo_versions is greater than or equal to value
      - in: query
        name: retain_repo_versions__isnull
        schema:
          type: boolean
        description: Filter results where retain_repo_versions has a null value
      - in: query
        name: retain_repo_versions__lt
        schema:
          type: integer
        description: Filter results where retain_repo_versions is less than value
      - in: query
        name: retain_repo_versions__lte
        schema:
          type: integer
        description: Filter results where retain_repo_versions is less than or equal to value
      - in: query
        name: retain_repo_versions__ne
        schema:
          type: integer
        description: Filter results where retain_repo_versions not equal to value
      - in: query
        name: retain_repo_versions__range
        schema:
          type: array
          items:
            type: integer
        description: Filter results where retain_repo_versions is between two comma separated values
        explode: false
        style: form
      - in: query
        name: with_content
        schema:
          type: string
        description: Content Unit referenced by HREF
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Repositories: Container-Push'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paginatedcontainer.ContainerPushRepositoryResponseList'
          description: ''
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/{pulp_id}/:
    get:
      operationId: repositories_container_container_push_read
      description: 'ViewSet for a container push repository.


        POST and DELETE are disallowed because a push repository is tightly coupled with a

        ContainerDistribution which handles it automatically.

        Created - during push operation, removed - with ContainerDistribution removal.'
      summary: Inspect a container push repository
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Repositories: Container-Push'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/container.ContainerPushRepositoryResponse'
          description: ''
    put:
      operationId: repositories_container_container_push_update
      description: Trigger an asynchronous update task
      summary: Update a container push repository
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      tags:
      - 'Repositories: Container-Push'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/container.ContainerPushRepository'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/container.ContainerPushRepository'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/container.ContainerPushRepository'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
          description: ''
    patch:
      operationId: repositories_container_container_push_partial_update
      description: Trigger an asynchronous partial update task
      summary: Update a container push repository
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      tags:
      - 'Repositories: Container-Push'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Patchedcontainer.ContainerPushRepository'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Patchedcontainer.ContainerPushRepository'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Patchedcontainer.ContainerPushRepository'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/{pulp_id}/add_role/:
    post:
      operationId: repositories_container_container_push_add_role
      description: Add a role for this object to users/groups.
      summary: Add a role
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      tags:
      - 'Repositories: Container-Push'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NestedRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NestedRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NestedRole'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestedRoleResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/{pulp_id}/list_roles/:
    get:
      operationId: repositories_container_container_push_list_roles
      description: List roles assigned to this object.
      summary: List roles
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Repositories: Container-Push'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectRolesResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/{pulp_id}/my_permissions/:
    get:
      operationId: repositories_container_container_push_my_permissions
      description: List permissions available to the current user on this object.
      summary: List user permissions
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - 'Repositories: Container-Push'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPermissionsResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/{pulp_id}/remove_image/:
    post:
      operationId: repositories_container_container_push_remove_image
      description: Trigger an asynchronous task to remove a manifest and all its associated data by a digest
      summary: Delete an image from a repository
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      tags:
      - 'Repositories: Container-Push'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveImage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RemoveImage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RemoveImage'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/{pulp_id}/remove_role/:
    post:
      operationId: repositories_container_container_push_remove_role
      description: Remove a role for this object from users/groups.
      summary: Remove a role
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      tags:
      - 'Repositories: Container-Push'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NestedRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NestedRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NestedRole'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NestedRoleResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/{pulp_id}/remove_signatures/:
    post:
      operationId: repositories_container_container_push_remove_signatures
      description: Create a task which deletes signatures by the passed key_id.
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      tags:
      - 'Repositories: Container-Push'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveSignatures'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RemoveSignatures'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RemoveSignatures'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveSignaturesResponse'
          description: ''
      summary: Repositories container container push remove signatures
      x-summary-source: derived
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/{pulp_id}/sign/:
    post:
      operationId: repositories_container_container_push_sign
      description: Trigger an asynchronous task to sign content.
      summary: Sign images in the repo
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      tags:
      - 'Repositories: Container-Push'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositorySign'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RepositorySign'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RepositorySign'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/{pulp_id}/tag/:
    post:
      operationId: repositories_container_container_push_tag
      description: Trigger an asynchronous task to tag an image in the repository
      summary: Create a Tag
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      tags:
      - 'Repositories: Container-Push'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagImage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TagImage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TagImage'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
          description: ''
  /api/automation-hub/pulp/api/v3/repositories/container/container-push/{pulp_id}/untag/:
    post:
      operationId: repositories_container_container_push_untag
      description: Trigger an asynchronous task to untag an image in the repository
      summary: Delete a tag
      parameters:
      - in: path
        name: pulp_id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this container push repository.
        required: true
      tags:
      - 'Repositories: Container-Push'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnTagImage'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UnTagImage'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UnTagImage'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncOperationResponse'
          description: ''
components:
  schemas:
    ObjectRolesResponse:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/NestedRoleResponse'
      required:
      - roles
    container.ContainerPushRepositoryResponse:
      type: object
      description: Serializer for Container Push Repositories.
      properties:
        pulp_created:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of creation.
        retain_repo_versions:
          type:
          - integer
          - 'null'
          format: int64
          description: Retain X versions of the repository. Default is null which retains all versions.
          minimum: 1
        pulp_last_updated:
          type: string
          format: date-time
          readOnly: true
          description: 'Timestamp of the last time this resource was updated. Note: for immutable resources - like content, repository versions, and publication - pulp_created and pulp_last_updated dates will be the same.'
        pulp_labels:
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
        latest_version_href:
          type: string
          format: uri
          readOnly: true
        name:
          type: string
          description: A unique name for this repository.
        pulp_href:
          type: string
          format: uri
          readOnly: true
        description:
          type:
          - string
          - 'null'
          description: An optional description.
        manifest_signing_service:
          type:
          - string
          - 'null'
          format: uri
          description: A reference to an associated signing service.
        versions_href:
          type: string
          format: uri
          readOnly: true
      required:
      - name
    AsyncOperationResponse:
      type: object
      description: Serializer for asynchronous operations.
      properties:
        task:
          type: string
          format: uri
          description: The href of the task.
      required:
      - task
    UnTagImage:
      type: object
      description: A serializer for parsing and validating data associated with a manifest untagging.
      properties:
        tag:
          type: string
          minLength: 1
          description: A tag name
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
      required:
      - tag
    Paginatedcontainer.ContainerPushRepositoryResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/container.ContainerPushRepositoryResponse'
    RemoveSignaturesResponse:
      type: object
      description: A serializer for parsing and validating data associated with the signatures removal.
      properties:
        signed_with_key_id:
          type: string
          description: key_id of the key the signatures were produced with
      required:
      - signed_with_key_id
    RemoveSignatures:
      type: object
      description: A serializer for parsing and validating data associated with the signatures removal.
      properties:
        signed_with_key_id:
          type: string
          minLength: 1
          description: key_id of the key the signatures were produced with
      required:
      - signed_with_key_id
    RemoveImage:
      type: object
      description: A serializer for parsing and validating data associated with the image removal.
      properties:
        digest:
          type: string
          minLength: 1
          description: sha256 of the Manifest file
      required:
      - digest
    NestedRoleResponse:
      type: object
      description: 'Serializer to add/remove object roles to/from users/groups.


        This is used in conjunction with ``pulpcore.app.viewsets.base.RolesMixin`` and requires the

        underlying object to be passed as ``content_object`` in the context.'
      properties:
        users:
          type: array
          items:
            type: string
            description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
          default: []
        groups:
          type: array
          items:
            type: string
          default: []
        role:
          type: string
      required:
      - role
    container.ContainerPushRepository:
      type: object
      description: Serializer for Container Push Repositories.
      properties:
        retain_repo_versions:
          type:
          - integer
          - 'null'
          format: int64
          description: Retain X versions of the repository. Default is null which retains all versions.
          minimum: 1
        pulp_labels:
          type: object
          additionalProperties:
            type:
            - string
            - 'null'
        name:
          type: string
          minLength: 1
          description: A unique name for this repository.
        description:
          type:
          - string
          - 'null'
          minLength: 1
          description: An optional description.
        manifest_signing_service:
          type:
          - string
          - 'null'
          format: uri
          description: A reference to an associated signing service.
      required:
      - name
    MyPermissionsResponse:
      type: object
      properties:
        permissions:
          type: array
          items:
            type: string
      required:
      - permissions
    TagImage:
      type: object
      description: A serializer for parsing and validating data associated with a manifest tagging.
      properties:
        tag:
          type: string
          minLength: 1
          description: A tag name
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
        digest:
          type: string
          minLength: 1
          description: sha256 of the Manifest file
      required:
      - digest
      - tag
    NestedRole:
      type: object
      description: 'Serializer to add/remove object roles to/from users/groups.


        This is used in conjunction with ``pulpcore.app.viewsets.base.RolesMixin`` and requires the

        underlying object to be passed as ``content_object`` in the context.'
      properties:
        users:
          type: array
          items:
            type: string
            minLength: 1
            description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_ only.
          default: []
        groups:
          type: array
          items:
            type: string
            minLength: 1
          default: []
