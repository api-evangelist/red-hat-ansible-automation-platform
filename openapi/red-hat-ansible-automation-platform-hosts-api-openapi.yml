- name: Hosts
paths:
  /api/v2/hosts/:
    get:
      operationId: hosts_list
      parameters:
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - Hosts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHostList'
          description: ''
      x-ai-description: A list of hosts.
      summary: Hosts list
      x-summary-source: derived
    post:
      operationId: hosts_create
      tags:
      - Hosts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Host'
          description: ''
      x-ai-description: Create a host entry in an inventory. Hosts are managed nodes that Ansible automation can execute against.
      summary: Hosts create
      x-summary-source: derived
