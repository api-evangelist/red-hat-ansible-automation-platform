components:
  schemas:
    JobHostSummary:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          type: string
          readOnly: true
        url:
          type: string
          readOnly: true
        related:
          type: string
          readOnly: true
        summary_fields:
          type: string
          readOnly: true
        created:
          type: string
          readOnly: true
        modified:
          type: string
          readOnly: true
        job:
          type: integer
          readOnly: true
        host:
          type:
          - integer
          - 'null'
          readOnly: true
        constructed_host:
          type:
          - integer
          - 'null'
          readOnly: true
          description: Only for jobs run against constructed inventories, this links to the host inside the constructed inventory.
        host_name:
          type: string
          readOnly: true
          default: ''
        changed:
          type: integer
          minimum: 0
          readOnly: true
        dark:
          type: integer
          minimum: 0
          readOnly: true
        failures:
          type: integer
          minimum: 0
          readOnly: true
        ok:
          type: integer
          minimum: 0
          readOnly: true
        processed:
          type: integer
          minimum: 0
          readOnly: true
        skipped:
          type: integer
          minimum: 0
          readOnly: true
        failed:
          type: boolean
          readOnly: true
        ignored:
          type: integer
          minimum: 0
          readOnly: true
        rescued:
          type: integer
          minimum: 0
          readOnly: true
    Inventory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          type: string
          readOnly: true
        url:
          type: string
          readOnly: true
        related:
          type: string
          readOnly: true
        summary_fields:
          type: string
          readOnly: true
        created:
          type: string
          readOnly: true
        modified:
          type: string
          readOnly: true
        name:
          type:
          - string
          - 'null'
          maxLength: 512
        description:
          type:
