components:
  schemas:
    PatchedAuthenticatorMap:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        related:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        summary_fields:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        created_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who created this resource.
        modified:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        modified_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who last modified this resource.
        name:
          type: string
          description: The name of this resource.
          maxLength: 512
        authenticator:
          type: integer
          description: The authenticator this mapping belongs to.
        map_type:
          enum:
          - allow
          - is_superuser
          - role
          - organization
          - team
          type: string
          x-spec-enum-id: 4064e71cef1ae1e7
          description: 'What will the map grant the user? System access (allow) a team or organization membership, the superuser flag or a role in the system.


            * `allow` - allow

            * `is_superuser` - is_superuser

            * `role` - role

            * `organization` - organization

            * `team` - team'
        role:
          type:
          - string
          - 'null'
          description: The role this map will grant the authenticating user to the targeted object. Will expand {% for_attr_value(user_orgs) %} syntax
          maxLength: 512
        organization:
          type:
          - string
          - 'null'
          description: An organization name this rule works on. Will expand {% for_attr_value(user_orgs) %} syntax
          maxLength: 512
        team:
          type:
          - string
          - 'null'
          description: A team name this rule works on. Will expand {% for_attr_value(user_orgs) %} syntax.
          maxLength: 512
        revoke:
          type: boolean
          description: Revoke the permission if a user does not meet this rule.
        triggers:
          description: Required. Trigger conditions dictionary that determines when this map applies. See /trigger_definition/ for structure details. Only one top-level key per request.
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: The order in which this rule should be processed, smaller numbers are of higher precedence. Items with the same order will be executed in random order.
    Authenticator:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        related:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        summary_fields:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        created_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who created this resource.
        modified:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        modified_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who last modified this resource.
        name:
          type: string
          description: The name of this resource.
          maxLength: 512
        enabled:
          type: boolean
          description: Should this authenticator be enabled.
        create_objects:
          type: boolean
          description: Allow authenticator to create objects (users, teams, organizations).
        remove_users:
          type: boolean
          description: When a user authenticates from this source should they be removed from any other groups they were previously added to.
        configuration:
          description: The required configuration for this source.
        type:
          enum:
          - ansible_base.authentication.authenticator_plugins.github_enterprise
          - ansible_base.authentication.authenticator_plugins.github_enterprise_team
          - ansible_base.authentication.authenticator_plugins.saml
          - ansible_base.authentication.authenticator_plugins.tacacs
          - ansible_base.authentication.authenticator_plugins.oidc
          - ansible_base.authentication.authenticator_plugins.github_enterprise_org
          - ansible_base.authentication.authenticator_plugins.radius
          - ansible_base.authentication.authenticator_plugins.github
          - ansible_base.authentication.authenticator_plugins.local
          - ansible_base.authentication.authenticator_plugins.github_org
          - ansible_base.authentication.authenticator_plugins.keycloak
          - ansible_base.authentication.authenticator_plugins.google_oauth2
          - ansible_base.authentication.authenticator_plugins.ldap
          - ansible_base.authentication.authenticator_plugins.azuread
          - ansible_base.authentication.authenticator_plugins.github_team
          type: string
          description: '* `ansible_base.authentication.authenticator_plugins.github_enterprise` - ansible_base.authentication.authenticator_plugins.github_enterprise

