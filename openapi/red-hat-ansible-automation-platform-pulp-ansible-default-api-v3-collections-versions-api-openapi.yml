paths:
  /pulp_ansible/galaxy/default/api/v3/collections/{namespace}/{name}/versions/:
    get:
      operationId: pulp_ansible_galaxy_default_api_v3_collections_versions_list
      description: Legacy v3 endpoint.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: name
        schema:
          type: string
        required: true
      - in: query
        name: name
        schema:
          type: string
      - in: path
        name: namespace
        schema:
          type: string
        required: true
      - in: query
        name: namespace
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -authors
            - -contents
            - -dependencies
            - -description
            - -docs_blob
            - -documentation
            - -files
            - -homepage
            - -is_highest
            - -issues
