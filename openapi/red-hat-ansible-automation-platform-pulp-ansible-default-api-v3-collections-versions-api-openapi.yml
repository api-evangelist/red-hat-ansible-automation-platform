            - -pulp_last_updated
            - -pulp_type
            - -repository
            - -requires_ansible
            - -search_vector
            - -sha256
            - -timestamp_of_interest
            - -upstream_id
            - -version
            - -version_major
            - -version_minor
            - -version_patch
            - -version_prerelease
            - authors
