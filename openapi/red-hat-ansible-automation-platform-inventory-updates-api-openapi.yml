- name: inventory_updates
paths:
  /api/v2/inventory_updates/:
    get:
      operationId: inventory_updates_list
      parameters:
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - inventory_updates
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInventoryUpdateListList'
          description: ''
      x-ai-description: List inventory updates
      summary: Inventory updates list
      x-summary-source: derived
  /api/v2/inventory_updates/{id}/:
    get:
      operationId: inventory_updates_retrieve
      description: Special handling when deleting a running unified job object.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - inventory_updates
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryUpdateDetail'
          description: ''
      x-ai-description: Retrieve an inventory update
      summary: Inventory updates retrieve
      x-summary-source: derived
    delete:
      operationId: inventory_updates_destroy
      description: Special handling when deleting a running unified job object.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - inventory_updates
      responses:
        '204':
          description: No response body
      x-ai-description: Delete an inventory update
      summary: Inventory updates destroy
      x-summary-source: derived
  /api/v2/inventory_updates/{id}/cancel/:
    get:
      operationId: inventory_updates_cancel_retrieve
      parameters:
