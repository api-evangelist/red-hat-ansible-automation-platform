          description: ''
      x-ai-description: Retrieve a cancel for an inventory update
      summary: Inventory updates cancel retrieve
      x-summary-source: derived
    post:
      operationId: inventory_updates_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - inventory_updates
      responses:
        '200':
