openapi: 3.2.0
info:
  title: AWX Project Updates API
  version: v2
  description: AWX API Documentation
  contact:
    email: ansible-community@redhat.com
  license:
    name: Apache License
tags:
- name: Project Updates
paths:
  /api/v2/project_updates/:
    get:
      operationId: project_updates_list
      parameters:
      - in: query
        name: order
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - in: query
        name: order_by
        schema:
          type: string
        description: Order results by field name. Prefix with '-' for descending order. Supports comma-separated values for multiple fields.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: role_level
        schema:
          type: string
        description: Filter by role level for RBAC
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
        description: Filter by object type. Supports comma-separated values for multiple types.
      tags:
      - Project Updates
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectUpdateListList'
          description: ''
      x-ai-description: List project updates
      summary: Project updates list
      x-summary-source: derived
  /api/v2/project_updates/{id}/:
    get:
      operationId: project_updates_retrieve
      description: Special handling when deleting a running unified job object.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Project Updates
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpdateDetail'
          description: ''
      x-ai-description: Retrieve a project update
      summary: Project updates retrieve
      x-summary-source: derived
    delete:
      operationId: project_updates_destroy
      description: Special handling when deleting a running unified job object.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Project Updates
      responses:
        '204':
          description: No response body
      x-ai-description: Delete a project update
      summary: Project updates destroy
      x-summary-source: derived
  /api/v2/project_updates/{id}/cancel/:
    get:
      operationId: project_updates_cancel_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Project Updates
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpdateCancel'
          description: ''
      x-ai-description: Retrieve single cancel for a project_update
      summary: Project updates cancel retrieve
      x-summary-source: derived
    post:
      operationId: project_updates_cancel_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      tags:
      - Project Updates
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectUpdateCancel'
          description: ''
      x-ai-description: Create new cancel for a project_update
      summary: Project updates cancel create
      x-summary-source: derived
