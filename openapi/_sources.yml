description: >-
  Provenance for every OpenAPI definition harvested into openapi/. Red Hat Ansible
  Automation Platform is installed by the customer, so most component specs are served
  from the customer's own installation (/api/controller/v2/schema/, /api/eda/v1/openapi.json,
  /api/gateway/v1/schema/) and are not fetchable from a Red Hat host. Red Hat publishes the
  same generated documents in its own aap-mcp-server repository, which loads them at runtime
  to build MCP tools; those are the copies captured here. The Automation Hub spec is the LIVE
  document served anonymously from Red Hat's Hybrid Cloud Console.
ownership_check:
  verdict: owned-by-provider
  note: >-
    Every spec identifies itself as a Red Hat Ansible Automation Platform component.
    automation-controller declares info.contact.email ansible-community@redhat.com (Automation
    Controller is the productized AWX, and Red Hat's own MCP server registers this document as
    its `controller` service); automation-hub declares contact ansible-galaxy-team@redhat.com
    and info.contact.url https://www.ansible.com/products/automation-hub; event-driven-ansible
    declares servers[] /api/eda/v1, matching the AAP EDA base path; platform-gateway is titled
    "AAP gateway API"; ansible-lightspeed declares servers[] https://aap/api/lightspeed/v1
    "Access through an Ansible Automation Platform gateway". No sibling-product contamination.
