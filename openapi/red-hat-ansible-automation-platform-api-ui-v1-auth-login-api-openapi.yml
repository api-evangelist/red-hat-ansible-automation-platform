openapi: 3.2.0
info:
  title: 'Automation Hub Api: _Ui V1 Auth Login API'
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: 'Api: _Ui V1 Auth Login'
paths:
  /api/automation-hub/_ui/v1/auth/login/:
    get:
      operationId: api_automation_hub__ui_v1_auth_login_get
      tags:
      - 'Api: _Ui V1 Auth Login'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/galaxy.LoginResponse'
          description: ''
      summary: Api automation hub ui v1 auth login get
      x-summary-source: derived
    post:
      operationId: api_automation_hub__ui_v1_auth_login_post
      tags:
      - 'Api: _Ui V1 Auth Login'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/galaxy.Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/galaxy.Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/galaxy.Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/galaxy.LoginResponse'
          description: ''
      summary: Api automation hub ui v1 auth login post
      x-summary-source: derived
components:
  schemas:
    galaxy.Login:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    galaxy.LoginResponse:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - password
      - username
