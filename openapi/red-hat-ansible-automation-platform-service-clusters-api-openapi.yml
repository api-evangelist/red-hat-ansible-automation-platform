components:
  schemas:
    PaginatedServiceClusterList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCluster'
    AdditionalRoute:
      type: object
      description: 'Base serializer for route models.


        Provides common validation logic for routes including:

        - Gateway authentication validation for internal routes

        - Mutual TLS (mTLS) validation with gateway authentication

        - Gateway path normalization (collapsing consecutive slashes)

        - Node tags normalization

        - Timeout floor enforcement (request_timeout_seconds & idle_timeout_seconds)


        Subclasses can override validate() and call super().validate()

        to add their own validation logic.'
      properties:
        id:
          type: integer
          readOnly: true
        url:
          type: string
          readOnly: true
        related:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        summary_fields:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        created_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who created this resource.
        modified:
          type: string
          format: date-time
          readOnly: true
          description: The date/time this resource was created.
        modified_by:
          type:
          - integer
          - 'null'
          readOnly: true
          description: The user who last modified this resource.
        name:
          type: string
          description: The name of this resource.
          maxLength: 512
        request_timeout_seconds:
          type:
          - integer
          - 'null'
          maximum: 604800
          minimum: 0
          description: The request timeout in seconds for this route. Values below the global proxy request_timeout setting are rejected. Leave null to use the global proxy timeout setting. See effective_timeout_seconds for the computed value applied to the route.
        idle_timeout_seconds:
          type:
          - integer
          - 'null'
          maximum: 86400
          minimum: 0
          description: The idle timeout in seconds for this route. Connections with no data transmitted within this period are closed. Values below the global proxy idle_timeout setting are rejected. Leave null to use the global proxy idle timeout setting. See effective_idle_timeout_seconds for the computed value applied to the route.
        effective_timeout_seconds:
          type: string
          readOnly: true
          description: 'Read-only. The effective request timeout: max(request_timeout_seconds, global request_timeout setting).'
        effective_idle_timeout_seconds:
          type: string
          readOnly: true
          description: 'Read-only. The effective idle timeout: max(idle_timeout_seconds, global idle_timeout setting).'
        http_port:
          type: integer
          description: The port on the AAP gateway to listen to traffic on.
        service_cluster:
          type: integer
          description: The AAP Service to route traffic to.
        service_port:
          type: integer
          maximum: 65535
          minimum: 1
          description: The port on the service cluster to route traffic to.
        is_service_https:
          type: boolean
          description: Set this to true if the service cluster requires HTTPS.
        is_internal_route:
          type: boolean
          description: If true, the AAP gateway will only allow other AAP services to access this route. Requires gateway auth to be enabled.
        service_path:
          type: string
          description: The URL path on the AAP Service cluster to route traffic to.
          maxLength: 255
        gateway_path:
          type: string
          description: The path on the AAP gateway to listen to traffic on.
          maxLength: 255
        description:
          type:
