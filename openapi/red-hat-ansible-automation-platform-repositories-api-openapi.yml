openapi: 3.2.0
info:
  title: Automation Hub Repositories API
  version: v3
  description: Fetch, Upload, Organize, and Distribute Ansible Collections
  contact:
    name: Automation Hub Team
    email: ansible-galaxy-team@redhat.com
    url: https://www.ansible.com/products/automation-hub
  license:
    name: GPLv2+
    url: https://raw.githubusercontent.com/ansible/galaxy_ng/main/LICENSE
  x-logo:
    url: https://pulp.plan.io/attachments/download/517478/pulp_logo_word_rectangle.svg
  x-pulp-app-versions:
    core: 3.49.40
    galaxy: 4.12.0dev
    ansible: 0.25.1
    container: 2.19.5
    certguard: 3.49.40
    file: 3.49.40
  x-pulp-domain-enabled: false
servers:
- url: http://automation-hub-backend-cwa.automation-hub-prod.svc.cluster.local:8000/
tags:
- name: Repositories
paths:
  /api/automation-hub/pulp/api/v3/repositories/:
    get:
      operationId: repositories_list
      description: Endpoint to list all repositories.
      summary: List repositories
      parameters:
      - in: query
        name: latest_with_content
        schema:
          type: string
        description: Content Unit referenced by HREF
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
        description: Filter results where name matches value
      - in: query
        name: name__contains
        schema:
          type: string
        description: Filter results where name contains value
      - in: query
        name: name__icontains
        schema:
          type: string
        description: Filter results where name contains value
      - in: query
        name: name__iexact
        schema:
          type: string
        description: Filter results where name matches value
      - in: query
        name: name__in
        schema:
          type: array
          items:
            type: string
        description: Filter results where name is in a comma-separated list of values
        explode: false
        style: form
      - in: query
        name: name__iregex
        schema:
          type: string
        description: Filter results where name matches regex value
      - in: query
        name: name__istartswith
        schema:
          type: string
        description: Filter results where name starts with value
      - in: query
        name: name__regex
        schema:
          type: string
        description: Filter results where name matches regex value
      - in: query
        name: name__startswith
        schema:
          type: string
        description: Filter results where name starts with value
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -description
            - -name
            - -next_version
            - -pk
            - -pulp_created
            - -pulp_id
            - -pulp_labels
            - -pulp_last_updated
            - -pulp_type
            - -retain_repo_versions
            - -user_hidden
            - description
            - name
            - next_version
            - pk
            - pulp_created
            - pulp_id
            - pulp_labels
            - pulp_last_updated
            - pulp_type
            - retain_repo_versions
            - user_hidden
        description: 'Ordering


          * `pulp_id` - Pulp id

          * `-pulp_id` - Pulp id (descending)

          * `pulp_created` - Pulp created

          * `-pulp_created` - Pulp created (descending)

          * `pulp_last_updated` - Pulp last updated

          * `-pulp_last_updated` - Pulp last updated (descending)

          * `pulp_type` - Pulp type

          * `-pulp_type` - Pulp type (descending)

          * `name` - Name

          * `-name` - Name (descending)

          * `pulp_labels` - Pulp labels

          * `-pulp_labels` - Pulp labels (descending)

          * `description` - Description

          * `-description` - Description (descending)

          * `next_version` - Next version

          * `-next_version` - Next version (descending)

          * `retain_repo_versions` - Retain repo versions

          * `-retain_repo_versions` - Retain repo versions (descending)

          * `user_hidden` - User hidden

          * `-user_hidden` - User hidden (descending)

          * `pk` - Pk

          * `-pk` - Pk (descending)'
        explode: false
        style: form
      - in: query
        name: pulp_href__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: pulp_id__in
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: pulp_label_select
        schema:
          type: string
        description: Filter labels by search string
      - in: query
        name: pulp_type
        schema:
          type: string
          enum:
          - ansible.ansible
          - container.container
          - container.container-push
          - file.file
        description: 'Pulp type


          * `ansible.ansible` - ansible.ansible

          * `container.container` - container.container

          * `container.container-push` - container.container-push

          * `file.file` - file.file'
      - in: query
        name: pulp_type__in
        schema:
          type: array
          items:
            type: string
            enum:
            - ansible.ansible
            - container.container
            - container.container-push
            - file.file
        description: 'Multiple values may be separated by commas.


          * `ansible.ansible` - ansible.ansible

          * `container.container` - container.container

          * `container.container-push` - container.container-push

          * `file.file` - file.file'
        explode: false
        style: form
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: remote
        schema:
          type: string
          format: uuid
        description: Foreign Key referenced by HREF
      - in: query
        name: retain_repo_versions
        schema:
          type: integer
        description: Filter results where retain_repo_versions matches value
      - in: query
        name: retain_repo_versions__gt
        schema:
          type: integer
        description: Filter results where retain_repo_versions is greater than value
      - in: query
        name: retain_repo_versions__gte
        schema:
          type: integer
        description: Filter results where retain_repo_versions is greater than or equal to value
      - in: query
        name: retain_repo_versions__isnull
        schema:
          type: boolean
        description: Filter results where retain_repo_versions has a null value
      - in: query
        name: retain_repo_versions__lt
        schema:
          type: integer
        description: Filter results where retain_repo_versions is less than value
      - in: query
        name: retain_repo_versions__lte
        schema:
          type: integer
        description: Filter results where retain_repo_versions is less than or equal to value
      - in: query
        name: retain_repo_versions__ne
        schema:
          type: integer
        description: Filter results where retain_repo_versions not equal to value
      - in: query
        name: retain_repo_versions__range
        schema:
          type: array
          items:
            type: integer
        description: Filter results where retain_repo_versions is between two comma separated values
        explode: false
        style: form
      - in: query
        name: with_content
        schema:
          type: string
        description: Content Unit referenced by HREF
      - in: query
        name: fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to include in the response.
      - in: query
        name: exclude_fields
        schema:
          type: array
          items:
            type: string
        description: A list of fields to exclude from the response.
      tags:
      - Repositories
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRepositoryResponseList'
          description: ''
components:
  schemas:
    RepositoryResponse:
      type: object
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        pulp_id:
          type: string
          format: uuid
          readOnly: true
        pulp_last_updated:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        content_count:
          type: integer
          readOnly: true
        gpgkey:
          type: string
      required:
      - gpgkey
      - name
    PaginatedRepositoryResponseList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryResponse'
